# About
insightful.about.title=حول آيات الحكمة
insightful.about.header=آيات الحكمة — منصة لمشاركة المعرفة والتعلّم
insightful.about.aboutUs=من نحن
insightful.about.description=آيات الحكمة هي منصة حديثة لمشاركة المعرفة والتعلّم، تتيح للمستخدمين رفع مختلف موارد التعلّم ومشاركتها مع الجميع بعد المراجعة. تهدف المنصة إلى جمع وتنظيم ونشر محتوى معرفي عالي الجودة، بما في ذلك المستندات والشفرة البرمجية والوسائط والملاحظات، ومساعدة المستخدمين على التعلّم والاستفادة منها بطريقة منظّمة وفعّالة.
insightful.about.mission=مهمتنا
insightful.about.missionDesc=مهمتنا هي بناء بيئة مفتوحة وموثوقة لمشاركة المعرفة، وتحويل المحتوى القيّم الذي يقدّمه المستخدمون إلى قاعدة معرفة عامة تنمو باستمرار للتعلّم والرجوع إليها.
insightful.about.features=مزايا المنصة
insightful.about.feature1=نظام رفع الموارد ومراجعتها من قبل المستخدمين
insightful.about.feature2=منصة لمشاركة المحتوى عالي الجودة
insightful.about.feature3=دعم موارد التعلّم متعددة الصيغ (مستندات، شفرة برمجية، وسائط، ملاحظات)
insightful.about.feature4=تنظيم وتصنيف المعرفة بشكل هيكلي
insightful.about.feature5=مساعدة الذكاء الاصطناعي في البحث والقراءة والتلخيص
insightful.about.impact=أثرنا
insightful.about.impactDesc=تُمكّن آيات الحكمة المستخدمين من مشاركة موارد تعلّم قيّمة والاستفادة من محتوى عالي الجودة يقدّمه المجتمع. ومن خلال مراجعة المحتوى والتنظيم الهيكلي، تساعد المنصة المتعلمين على الوصول إلى معرفة موثوقة بكفاءة أعلى، وتُسهم في بناء منظومة صحّية لمشاركة المعرفة.
insightful.about.future=آفاق المستقبل
insightful.about.futureDesc=في المستقبل، ستواصل آيات الحكمة تحسين آليات مراجعة المحتوى وقدرات إدارة المعرفة، وستُدخل المزيد من أدوات الذكاء الاصطناعي لمساعدة المستخدمين على اكتشاف المعرفة المشتركة وفهمها وإعادة استخدامها بكفاءة أكبر.

