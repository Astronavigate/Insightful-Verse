    .liquid {
        --liquid-border-radius: 1.8rem;
        --liquid-border: rgba(255, 255, 255, 0.7);
        --liquid-border-width: 1.8px;
        --liquid-border-inner-alpha: 0.18;
        --liquid-border-reflect: rgba(255, 255, 255, 0.9);
        --liquid-glow: rgba(255, 255, 255, 0.15);
        --liquid-glow-outer: rgba(0, 0, 0, 0.05);
        --liquid-edge-spot1: rgba(255, 255, 255, 0.15);
        --liquid-edge-spot2: rgba(255, 255, 255, 0.08);
        --liquid-background: rgba(255, 255, 255, 0.15);
        --liquid-blur: 10px;
        --liquid-saturate: 130%;

        position: relative;
        isolation: isolate;

        background: var(--liquid-background);
        border-radius: var(--liquid-border-radius);

        backdrop-filter: blur(var(--liquid-blur)) saturate(var(--liquid-saturate));
        -webkit-backdrop-filter: blur(var(--liquid-blur)) saturate(var(--liquid-saturate));

        box-shadow:
                0 0 0.8px var(--liquid-edge-spot1, rgba(255, 255, 255, 0.3)),
                0 6px 18px rgba(0, 0, 0, 0.25),
                0 0 16px var(--liquid-glow, rgba(255, 255, 255, 0.12)),
                0 0 24px var(--liquid-glow-outer, transparent);

        transition:
                background 0.3s ease,
                box-shadow 0.3s ease,
                color 0.25s ease;
    }

    /* === 动态主玻璃反光边缘 === */
    .liquid::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;

        border-radius: var(--liquid-border-radius);
        padding: var(--liquid-border-width, 1.8px);

        background:
                linear-gradient(
                        135deg,
                        var(--liquid-border) 0%,
                        rgba(255, 255, 255, 0.35) 20%,
                        rgba(255, 255, 255, 0.15) 40%,
                        rgba(0, 0, 0, 0.12) 65%,
                        rgba(0, 0, 0, 0.2) 100%
                );

        mask:
                linear-gradient(#000 0 0) content-box,
                linear-gradient(#000 0 0);
        mask-composite: exclude;

        opacity: 0.8;
        mix-blend-mode: overlay;
    }

    /* === 动态内侧蔓延高光 === */
    .liquid::after {
        content: "";
        position: absolute;
        inset: 1.4px;
        pointer-events: none;

        border-radius: calc(var(--liquid-border-radius) - 1.4px);

<script>
    (function(){
        const SELECTOR = '.liquid';
        const TOP_GAP = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--lv-top-gap')) || 16;
        const RETRIES = 22;
        const RETRY_DELAY = 90;
        const SCROLL_THROTTLE = 120;
        const RESIZE_THROTTLE = 200;
        const BRIGHT_THRESHOLD = 0.8; // 亮度分界点
        const BRIGHT_THRESHOLD_HIGH = 0.88; // 变亮阈值
        const BRIGHT_THRESHOLD_LOW = 0.72;  // 变暗阈值
        const NEAR_BLACK = 12;
        const NEAR_WHITE = 243;

        /* 亮度状态管理器 - 添加缓冲机制 */
        class BrightnessManager {
            constructor() {
                this.states = new Map(); // el -> { isDark, timestamp }
                this.hysteresis = {
                    darkToLight: BRIGHT_THRESHOLD_HIGH, // 暗变亮需要达到0.72
                    lightToDark: BRIGHT_THRESHOLD_LOW   // 亮变暗需要达到0.56
                };
            }

            getState(el, currentLuminance) {
                const now = Date.now();
                const previous = this.states.get(el);

                // 初次判断
                if (!previous) {
                    const isDark = currentLuminance < BRIGHT_THRESHOLD;
                    this.states.set(el, {
                        isDark,
                        timestamp: now,
                        lastLuminance: currentLuminance
                    });
                    return isDark;
                }

                const timeSinceChange = now - previous.timestamp;

                // 如果时间太短，保持原状态（防抖动）
                if (timeSinceChange < 100) {
                    return previous.isDark;
                }

                // 根据当前状态和亮度决定是否切换
                let shouldSwitch = false;

                if (previous.isDark) {
                    // 当前是暗色，需要达到0.72才变亮
                    shouldSwitch = currentLuminance >= this.hysteresis.darkToLight;
                } else {
                    // 当前是亮色，需要达到0.56才变暗
                    shouldSwitch = currentLuminance <= this.hysteresis.lightToDark;
                }

                if (shouldSwitch) {
                    const newState = {
                        isDark: !previous.isDark,
                        timestamp: now,
                        lastLuminance: currentLuminance
                    };
                    this.states.set(el, newState);
                    return newState.isDark;
                }

                // 更新亮度值但不改变状态
                previous.lastLuminance = currentLuminance;
                return previous.isDark;
            }

            clear() {
                this.states.clear();
            }
        }

        /* helpers */
        function parseRGBA(s){
            if(!s) return null;
            s = s.trim();
            if(s[0] === '#'){
                let h = s.slice(1);
                if(h.length===3) h = h.split('').map(c=>c+c).join('');
                if(h.length!==6) return null;
                return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16),1];
            }
            const m = s.match(/rgba?\((\d+)[,\s]+(\d+)[,\s]+(\d+)(?:[,\s\/]+([\d.]+))?\)/i);
            if(!m) return null;
            return [parseInt(m[1],10), parseInt(m[2],10), parseInt(m[3],10), m[4] !== undefined ? parseFloat(m[4]) : 1];
        }

        function luminance([r,g,b]){
            const srgb = [r,g,b].map(v=>v/255).map(c=>c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4));
            return 0.2126*srgb[0] + 0.7152*srgb[1] + 0.0722*srgb[2];
        }

        /* 改进的avgRGB - 去除最高和最低亮度点 */
        function avgRGB(arr){
            if(!arr || arr.length < 3) return null;

            // 计算每个点的亮度并存储
            const pointsWithLuminance = arr.map(rgb => ({
                rgb,
                lum: luminance(rgb)
            }));

            // 按亮度排序
            pointsWithLuminance.sort((a, b) => a.lum - b.lum);

            // 去除一个最高和一个最低亮度点
            const trimmed = pointsWithLuminance.slice(1, -1);

            // 计算剩余点的平均值
            let r=0, g=0, b=0;
            trimmed.forEach(p => {
                r += p.rgb[0];
                g += p.rgb[1];
                b += p.rgb[2];
            });

            const count = trimmed.length;
            return count ? [
                Math.round(r/count),
                Math.round(g/count),
                Math.round(b/count)
            ] : null;
        }

        function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
        function mixRGB(a,b,t){
            return [
                Math.round(a[0] + (b[0]-a[0])*t),
                Math.round(a[1] + (b[1]-a[1])*t),
                Math.round(a[2] + (b[2]-a[2])*t)
            ];
        }
        function rgbToCss(rgb,a=1){ return `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`; }

        function measure(el){
            if(!el) return 0;
            const r = el.getBoundingClientRect();
            if(r && r.height && r.height>0) return Math.ceil(r.height);
            if(el.offsetHeight && el.offsetHeight>0) return Math.ceil(el.offsetHeight);
            if(el.scrollHeight && el.scrollHeight>0) return Math.ceil(el.scrollHeight);
            let sum = 0;
            Array.from(el.children).forEach(ch=>{
                try{
                    const cs = getComputedStyle(ch);
                    if(cs.position==='absolute' || cs.position==='fixed') return;
                    const cr = ch.getBoundingClientRect();
                    sum += (cr && cr.height) ? cr.height : (ch.offsetHeight||ch.scrollHeight||0);
                }catch(e){}
            });
            return Math.ceil(sum||0);
        }

        /* 改进的采样函数 - 9点网格采样（3x3），只采正下方 */
        function sampleUnder(el){
            try{
                const rect = el.getBoundingClientRect();
                if(!rect || rect.width === 0 || rect.height === 0) return null;

                // 水平采样点：25%, 50%, 75%
                const horizontalPositions = [0.25, 0.5, 0.75];
                // 垂直采样点：正下方+2px, +6px, +10px
                const verticalOffsets = [-10, -5, 0];

                const samples = [];
                const maxSamples = 9; // 3x3网格

                // 边界检查
                const maxY = window.innerHeight - 2;
                const maxX = window.innerWidth - 2;

                // 创建采样网格
                for(const hPos of horizontalPositions){
                    const x = Math.round(clamp(
                        rect.left + rect.width * hPos,
                        2, maxX
                    ));

                    for(const vOffset of verticalOffsets){
                        const y = Math.round(clamp(
                            rect.bottom + vOffset,
                            2, maxY
                        ));

                        try{
                            // 使用document.elementFromPoint获取该点的元素
                            let node = document.elementFromPoint(x, y);
                            let depth = 0;
                            let foundValid = false;

                            while(node && depth < 10 && !foundValid){
                                // 跳过液体元素自身及其子元素
                                if(node === el || el.contains(node)){
                                    node = node.parentElement;
                                    depth++;
                                    continue;
                                }

                                const bg = getComputedStyle(node).backgroundColor;
                                if(bg && bg !== 'transparent' && bg !== 'rgba(0, 0, 0, 0)'){
                                    const rgba = parseRGBA(bg);
                                    if(rgba && rgba[3] > 0.1){
                                        samples.push([rgba[0], rgba[1], rgba[2]]);
                                        foundValid = true;
                                        break;
                                    }
                                }
                                node = node.parentElement;
                                depth++;
                            }

                            // 如果没找到有效背景色，使用body背景
                            if(!foundValid){
                                const bodyBg = getComputedStyle(document.body).backgroundColor;
                                const rgba = parseRGBA(bodyBg);
                                if(rgba) samples.push([rgba[0], rgba[1], rgba[2]]);
                            }
                        }catch(e){
                            console.debug('[liquid] Sampling error at', x, y, e);
                        }
                    }
                }

                // 如果采样点不足，添加备用点
                if(samples.length < 3){
                    const backupPoints = [
                        [rect.left + 4, rect.bottom + 4],
                        [rect.right - 4, rect.bottom + 4],
                        [rect.left + rect.width/2, rect.bottom + 8]
                    ];

                    for(const [x, y] of backupPoints){
                        if(x >= 2 && x <= maxX && y >= 2 && y <= maxY){
                            try{
                                let node = document.elementFromPoint(x, y);
                                if(node && node !== el && !el.contains(node)){
                                    const bg = getComputedStyle(node).backgroundColor;
                                    const rgba = parseRGBA(bg);
                                    if(rgba) samples.push([rgba[0], rgba[1], rgba[2]]);
                                }
                            }catch(e){}
                        }
                    }
                }

                return samples.length ? samples : null;
            }catch(e){
                console.warn('[liquid] Sampling error', e);
                return null;
            }
        }

        /* 平滑和过渡 */
        class ColorTransition {
            constructor() {
                this.previousColors = new Map();
                this.transitionDuration = 300;
            }

            getTransitionedColor(el, newRgb) {
                if(!newRgb) return null;

                const now = Date.now();
                const previous = this.previousColors.get(el);

                if(!previous) {
                    this.previousColors.set(el, {
                        rgb: newRgb,
                        timestamp: now
                    });
                    return newRgb;
                }

                const timeDiff = now - previous.timestamp;
                const transitionProgress = Math.min(timeDiff / this.transitionDuration, 1);
                const easeProgress = this.easeInOutCubic(transitionProgress);

                const transitionedRgb = [
                    Math.round(previous.rgb[0] + (newRgb[0] - previous.rgb[0]) * easeProgress),
                    Math.round(previous.rgb[1] + (newRgb[1] - previous.rgb[1]) * easeProgress),
                    Math.round(previous.rgb[2] + (newRgb[2] - previous.rgb[2]) * easeProgress)
                ];

                this.previousColors.set(el, {
                    rgb: transitionProgress >= 1 ? newRgb : transitionedRgb,
                    timestamp: now
                });

                return transitionProgress >= 1 ? newRgb : transitionedRgb;
            }

            easeInOutCubic(t) {
                return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
            }

            clear() {
                this.previousColors.clear();
            }
        }

        const colorTransition = new ColorTransition();
        const brightnessManager = new BrightnessManager(); // 亮度状态管理器

        /* 应用视觉效果 */
        function applyVisual(el, analysis){
            const isNav = el.tagName === 'NAV';

            // 设置z-index：nav高，其他元素低
            if(isNav){
                el.style.setProperty('z-index', '1030', 'important');
            } else {
                el.style.setProperty('z-index', '10', 'important'); // 降低z-index避免挡住下拉选项
            }

            const supportsBackdrop = window.CSS && CSS.supports &&
                (CSS.supports('backdrop-filter','blur(1px)') ||
                    CSS.supports('-webkit-backdrop-filter','blur(1px)'));

            const avgRgb = analysis && analysis.avgRGB ? analysis.avgRGB : null;
            const avgLum = analysis && typeof analysis.avgLum === 'number' ? analysis.avgLum : null;

            // 使用过渡颜色
            const transitionedRgb = avgRgb ? colorTransition.getTransitionedColor(el, avgRgb) : null;

            // 使用亮度管理器决定是否暗色背景（带缓冲）
            let bgIsDark = false;
            if(avgLum !== null){
                bgIsDark = brightnessManager.getState(el, avgLum);
            } else {
                // 没有亮度数据时保持原状态或默认
                const previousState = brightnessManager.states.get(el);
                bgIsDark = previousState ? previousState.isDark : true;
            }

            // 背景、模糊、饱和度
            const overlay = bgIsDark ?
                (isNav ? 'rgba(0,0,0,0.18)' : 'rgba(0,0,0,0.15)') :
                (isNav ? 'rgba(255,255,255,0.14)' : 'rgba(255,255,255,0.12)');
            const blurVal = bgIsDark ? (isNav ? 7 : 6) : (isNav ? 10 : 8);
            const sat = bgIsDark ? '125%' : '115%';

            // 基础颜色 - 使用过渡后的颜色
            const base = transitionedRgb || (bgIsDark ? [30,30,30] : [235,235,235]);

            // 边框参数
            let borderRgb, borderAlpha, borderWidth, innerAlpha, reflectAlpha;
            if(base[0] <= NEAR_BLACK && base[1] <= NEAR_BLACK && base[2] <= NEAR_BLACK){
                borderRgb = mixRGB(base, [255,255,255], 0.75);
                borderAlpha = isNav ? 0.16 : 0.14;
                borderWidth = isNav ? 1.8 : 1.6;
                innerAlpha = isNav ? 0.18 : 0.15;
                reflectAlpha = isNav ? 0.20 : 0.16;
            } else if(base[0] >= NEAR_WHITE && base[1] >= NEAR_WHITE && base[2] >= NEAR_WHITE){
                borderRgb = mixRGB(base, [0,0,0], 0.6);
                borderAlpha = isNav ? 0.14 : 0.12;
                borderWidth = isNav ? 1.8 : 1.6;
                innerAlpha = isNav ? 0.10 : 0.08;
                reflectAlpha = isNav ? 0.12 : 0.10;
            } else {
                const t = bgIsDark ? 0.65 : 0.28;
                borderRgb = mixRGB(base, [255,255,255], t);
                borderAlpha = bgIsDark ? (isNav ? 0.14 : 0.12) : (isNav ? 0.13 : 0.11);
                borderWidth = bgIsDark ? (isNav ? 2.0 : 1.8) : (isNav ? 1.8 : 1.6);
                innerAlpha = bgIsDark ? (isNav ? 0.20 : 0.16) : (isNav ? 0.12 : 0.10);
                reflectAlpha = bgIsDark ? (isNav ? 0.22 : 0.18) : (isNav ? 0.14 : 0.12);
            }

            // 发光效果
            const glow = bgIsDark ?
                (isNav ? 'rgba(255,255,255,0.14)' : 'rgba(255,255,255,0.12)') :
                (isNav ? 'rgba(255,255,255,0.10)' : 'rgba(255,255,255,0.08)');
            const glowOuter = bgIsDark ?
                (isNav ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.06)') :
                (isNav ? 'rgba(0,0,0,0.05)' : 'rgba(0,0,0,0.04)');
            const spot1 = bgIsDark ?
                (isNav ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.18)') :
                (isNav ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.10)');
            const spot2 = bgIsDark ?
                (isNav ? 'rgba(255,255,255,0.14)' : 'rgba(255,255,255,0.12)') :
                (isNav ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.06)');

            // 文字颜色（只针对nav元素）
            const textLight = bgIsDark;
            const textColor = textLight ? 'rgba(255,255,255,0.95)' : 'rgba(0,0,0,0.92)';
            const fillColor = textLight ? '#fff' : '#111';

            // 反射颜色
            const reflectRgb = mixRGB(base, [255,255,255], 0.85);

            // 检查变化
            const prev = el.__liquid_state || {};
            const prevKey = prev && prev.borderCss;
            const borderCss = rgbToCss(borderRgb, borderAlpha);
            const changed = !prev || prevKey !== borderCss ||
                prev.overlay !== overlay ||
                prev.textLight !== textLight;

            if(!changed) return;

            try{
                // 核心CSS变量
                el.style.setProperty('--liquid-background', overlay, 'important');
                el.style.setProperty('--liquid-blur', blurVal + 'px', 'important');
                el.style.setProperty('--liquid-saturate', sat, 'important');

                // 边框相关变量
                el.style.setProperty('--liquid-border', borderCss, 'important');
                el.style.setProperty('--liquid-border-width', borderWidth + 'px', 'important');
                el.style.setProperty('--liquid-border-inner-alpha', innerAlpha, 'important');
                el.style.setProperty('--liquid-border-reflect', rgbToCss(reflectRgb, reflectAlpha), 'important');

                // 发光效果变量
                el.style.setProperty('--liquid-glow', glow, 'important');
                el.style.setProperty('--liquid-glow-outer', glowOuter, 'important');
                el.style.setProperty('--liquid-edge-spot1', spot1, 'important');
                el.style.setProperty('--liquid-edge-spot2', spot2, 'important');

                // 修复：只有nav元素才设置文本颜色和添加类
                if(isNav){
                    el.classList.toggle('force-dark', textLight);
                    el.classList.toggle('force-light', !textLight);
                    // 确保导航按钮颜色正确
                    ensureTogglerSVG(el, textLight);
                } else {
                    el.classList.remove('force-dark', 'force-light');
                }
            }catch(e){
                console.warn('[liquid] applyVisual exception', e);
            }

            // 保存状态
            el.__liquid_state = {
                textLight,
                overlay,
                blurVal,
                sat,
                borderRgb: borderRgb,
                borderCss,
                borderWidth,
                innerAlpha,
                reflectCss: rgbToCss(reflectRgb, reflectAlpha),
                glow,
                glowOuter,
                spot1,
                spot2,
                textColor,
                reflectRgb,
                bgIsDark // 保存当前亮度状态
            };
        }

        /* 其他辅助函数 */
        function ensureTogglerSVG(el, textLight){
            try{
                const toggler = el.querySelector('.navbar-toggler');
                if(!toggler) return;
                const comp = window.getComputedStyle(toggler);
                const bg = comp.getPropertyValue('background-image');
                const fill = textLight ? '#fff' : '#111';
                if(bg && bg !== 'none'){
                    toggler.innerHTML = '<svg width="24" height="18" viewBox="0 0 24 18" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
                        '<rect y="0" x="0" width="24" height="2" rx="1"></rect>' +
                        '<rect y="8" x="0" width="24" height="2" rx="1"></rect>' +
                        '<rect y="16" x="0" width="24" height="2" rx="1"></rect>' +
                        '</svg>';
                    toggler.querySelectorAll('svg, rect, path').forEach(s=>{
                        try{ s.style.setProperty('fill', fill, 'important'); }catch(e){}
                        try{ s.style.setProperty('stroke', fill, 'important'); }catch(e){}
                    });
                } else {
                    toggler.querySelectorAll('svg, path, rect, circle').forEach(s=>{
                        try{ s.style.setProperty('fill', fill, 'important'); }catch(e){}
                        try{ s.style.setProperty('stroke', fill, 'important'); }catch(e){}
                    });
                }
            }catch(e){}
        }

        function preserveBorderRadius(el){
            try{
                const cs = getComputedStyle(el);
                const br = cs.borderRadius || cs.getPropertyValue('border-radius') || '1.8rem';
                el.style.setProperty('--liquid-border-radius', br, 'important');
            }catch(e){}
        }

        /* 主初始化逻辑 */
        function initAll(){
            const elements = Array.from(document.querySelectorAll(SELECTOR));
            if(!elements.length) return;

            // 清理状态
            colorTransition.clear();
            brightnessManager.clear();

            elements.forEach(el => {
                preserveBorderRadius(el);
                const isNav = el.tagName === 'NAV';

                // 设置z-index
                if(isNav){
                    el.style.setProperty('z-index', '1030', 'important');
                    initNavImmediately(el);
                } else {
                    el.style.setProperty('z-index', '10', 'important'); // 低z-index
                }

                // 立即应用初始样式防止闪烁
                el.style.setProperty('transition', 'all 0.3s ease-in-out', 'important');

                // 延迟采样以等待布局稳定
                setTimeout(() => {
                    const samples = sampleUnder(el);
                    if(samples && samples.length >= 3){
                        // 计算平均亮度（去除最高最低）
                        const avgRGBValue = avgRGB(samples);

                        // 计算每个点的亮度
                        const luminances = samples.map(rgb => luminance(rgb));
                        // 排序并去除最高最低
                        luminances.sort((a, b) => a - b);
                        const trimmedLuminances = luminances.slice(1, -1);
                        // 计算平均亮度
                        const avgLum = trimmedLuminances.reduce((sum, lum) => sum + lum, 0) / trimmedLuminances.length;

                        const analysis = {
                            avgRGB: avgRGBValue,
                            avgLum: avgLum
                        };
                        applyVisual(el, analysis);
                    } else {
                        // 采样失败时的默认处理
                        applyVisual(el, null);
                    }
                }, 50);
            });

            // 添加事件监听
            const onScroll = throttle(() => {
                elements.forEach(el => {
                    // 如果是下拉菜单并且正在显示，跳过更新
                    if (el.classList.contains('dropdown-menu') && el.classList.contains('show')) {
                        return;
                    }

                    const samples = sampleUnder(el);
                    if(samples && samples.length >= 3){
                        const avgRGBValue = avgRGB(samples);
                        const luminances = samples.map(rgb => luminance(rgb));
                        luminances.sort((a, b) => a - b);
                        const trimmedLuminances = luminances.slice(1, -1);
                        const avgLum = trimmedLuminances.reduce((sum, lum) => sum + lum, 0) / trimmedLuminances.length;

                        const analysis = {
                            avgRGB: avgRGBValue,
                            avgLum: avgLum
                        };
                        applyVisual(el, analysis);
                    }
                });
            }, SCROLL_THROTTLE);

            const onResize = throttle(() => {
                elements.forEach(el => {
                    preserveBorderRadius(el);
                    const samples = sampleUnder(el);
                    if(samples && samples.length >= 3){
                        const avgRGBValue = avgRGB(samples);
                        const luminances = samples.map(rgb => luminance(rgb));
                        luminances.sort((a, b) => a - b);
                        const trimmedLuminances = luminances.slice(1, -1);
                        const avgLum = trimmedLuminances.reduce((sum, lum) => sum + lum, 0) / trimmedLuminances.length;

                        const analysis = {
                            avgRGB: avgRGBValue,
                            avgLum: avgLum
                        };
                        applyVisual(el, analysis);
                    }
                });
            }, RESIZE_THROTTLE);

            window.addEventListener('scroll', onScroll, {passive: true});
            window.addEventListener('resize', onResize);
        }

        /* 节流函数 */
        function throttle(fn, wait){
            let last = 0, timeout = null;
            return function(...args){
                const now = Date.now();
                const remaining = wait - (now - last);
                if(remaining <= 0 || remaining > wait){
                    if(timeout){
                        clearTimeout(timeout);
                        timeout = null;
                    }
                    last = now;
                    fn.apply(this, args);
                } else if(!timeout){
                    timeout = setTimeout(()=>{
                        last = Date.now();
                        timeout = null;
                        fn.apply(this, args);
                    }, remaining);
                }
            };
        }

        /* 导航初始化函数 */
        let navHeightSet = false;
        let navHeight = 0;

        function initNavImmediately(el){
            if(el.tagName === 'NAV'){
                el.classList.add('fixed-top-force');
                el.style.setProperty('position', 'fixed', 'important');
                el.style.setProperty('top', '0', 'important');
                el.style.setProperty('left', '8%', 'important');
                el.style.setProperty('right', '8%', 'important');
                el.style.setProperty('width', 'auto', 'important');
                el.style.setProperty('box-sizing', 'border-box', 'important');
                el.style.setProperty('z-index', '1030', 'important');

                const tempHeight = measure(el) || 60;
                document.body.style.setProperty('padding-top', (tempHeight + TOP_GAP) + 'px');

                navHeight = tempHeight;
                document.documentElement.style.setProperty('--nav-height', navHeight + 'px');
                navHeightSet = true;
            }
        }

        // 启动
        if(document.readyState === 'loading'){
            document.addEventListener('DOMContentLoaded', initAll);
        } else {
            setTimeout(initAll, 100);
        }

        // 手动刷新
        window.__liquidRefreshAll = function(){
            try{
                initAll();
            }catch(e){
                console.warn('[liquid] refresh failed', e);
            }
        };

    })();
</script>
