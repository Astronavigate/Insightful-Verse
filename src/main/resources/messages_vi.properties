# ==================== 关于（About） ====================
insightful.about.title=Về Chương Tri Thức
insightful.about.header=Chương Tri Thức — Nền tảng chia sẻ kiến thức và học tập
insightful.about.aboutUs=Về chúng tôi
insightful.about.description=Chương Tri Thức là một nền tảng hiện đại về chia sẻ kiến thức và học tập, nơi người dùng có thể tải lên tài nguyên học tập và chia sẻ với người khác sau khi được duyệt. Nền tảng được thiết kế để giúp cá nhân và cộng đồng thu thập, tổ chức và khám phá nội dung kiến thức chất lượng cao, bao gồm tài liệu, mã nguồn, phương tiện truyền thông và ghi chú, theo cách có cấu trúc và bền vững.
insightful.about.mission=Sứ mệnh của chúng tôi
insightful.about.missionDesc=Sứ mệnh của chúng tôi là xây dựng một môi trường chia sẻ kiến thức mở và đáng tin cậy, biến nội dung chất lượng cao do người dùng đóng góp thành một cơ sở kiến thức công cộng không ngừng phát triển, phục vụ việc học tập và tham khảo.
insightful.about.features=Tính năng của chúng tôi
insightful.about.feature1=Hệ thống tải lên và duyệt tài nguyên của người dùng
insightful.about.feature2=Nền tảng chia sẻ nội dung chất lượng cao
insightful.about.feature3=Tài nguyên học tập đa định dạng (Tài liệu, Mã nguồn, Media, Ghi chú)
insightful.about.feature4=Tổ chức kiến thức có cấu trúc
insightful.about.feature5=Tìm kiếm, đọc và tóm tắt được hỗ trợ bởi AI
insightful.about.impact=Tác động của chúng tôi
insightful.about.impactDesc=Chương Tri Thức giúp người dùng chia sẻ tài liệu học tập có giá trị với người khác và tận dụng các nguồn tài nguyên cộng đồng chất lượng cao. Thông qua việc duyệt nội dung và tổ chức có cấu trúc, nền tảng giúp người học truy cập kiến thức đáng tin cậy hiệu quả hơn và thúc đẩy một hệ sinh thái chia sẻ kiến thức tích cực.
insightful.about.future=Triển vọng tương lai
insightful.about.futureDesc=Trong tương lai, Chương Tri Thức sẽ tiếp tục cải thiện hệ thống duyệt nội dung và khả năng tổ chức kiến thức, đồng thời giới thiệu nhiều công cụ AI hơn để giúp người dùng khám phá, hiểu và tái sử dụng kiến thức được chia sẻ một cách hiệu quả hơn.

