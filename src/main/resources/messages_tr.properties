# ==================== 关于（About） ====================
insightful.about.title=Insightful Verse Hakkında
insightful.about.header=Insightful Verse Zeki Eğitim Platformu
insightful.about.aboutUs=Hakkımızda
insightful.about.description=Insightful Verse Zeki Eğitim Platformu (Insightful Verse veya IVIEP), öğrenme ve bilgi aktarımını dönüştüren ileri düzey bir eğitim teknolojisi platformudur. Her yaştan ve geçmişten öğrenciler için kişiselleştirilmiş ve etkileşimli öğrenme deneyimleri sunma vizyonu ile kurulmuş olan Insightful Verse, öğrencilerin akademik ve kariyer hedeflerine ulaşmaları için gerekli araç ve kaynaklarla güçlendirmeyi amaçlamaktadır.
insightful.about.mission=Misyonumuz
insightful.about.missionDesc=Misyonumuz, öğrencilerin tutkularını keşfedebileceği, eleştirel düşünme becerilerini geliştirebileceği ve yaşam boyu öğrenme için sağlam bir temel oluşturabileceği kapsayıcı ve işbirlikçi bir öğrenme ortamı yaratmaktır.
insightful.about.features=Özelliklerimiz
insightful.about.feature1=Kişiselleştirilmiş Öğrenme Yolları
insightful.about.feature2=Etkileşimli İçerik
insightful.about.feature3=İşbirlikçi Öğrenme
insightful.about.feature4=Gerçek Zamanlı Geri Bildirim
insightful.about.feature5=Entegre Araçlar
insightful.about.impact=Etkimiz
insightful.about.impactDesc=Binlerce öğrenci, kişiselleştirilmiş öğrenme yolları ve etkileşimli içerikten faydalanarak akademik performanslarını artırmış ve daha yüksek katılım göstermiştir. Öğretmenler ve danışmanlar da platformumuzla artan verimlilik ve memnuniyet bildirmiştir.
insightful.about.future=Gelecek Vizyonu
insightful.about.futureDesc=İleriye baktığımızda, kullanıcıların değişen ihtiyaçlarına yanıt vermek için platformun özelliklerini ve hizmetlerini genişletmeye devam etmeyi planlıyoruz. Yapay zeka ve makine öğrenimi gibi gelişmiş teknolojileri entegre ederek öğrenme deneyimlerini daha da kişiselleştirmeyi ve öğrencilere başarı için daha etkili araçlar sunmayı hedefliyoruz.

