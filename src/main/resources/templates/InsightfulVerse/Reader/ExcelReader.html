<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Insightful Excel Reader ' + ${file != null ? ' - ' + file.fileName : 'None'}">Excel Reader</title>
    <style>
        :root {
            --header-h: 72px;
            --glass-bg: rgba(18, 18, 18, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary-text: #e6eef8;
            --secondary-text: #adb5bd;
            --background-dark: #050505;
            --ice-white: #ffffff;
            --silver-mercury: rgba(255, 255, 255, 0.35);
            --radius-btn: 8px;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background: var(--background-dark) !important;
            color: var(--primary-text);
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }

        .excel-wrap {
            height: calc(100vh - var(--header-h));
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 24px;
            box-sizing: border-box;
            align-items: center;
        }

        #excelContainer {
            width: 100%;
            max-width: 1400px;
            flex: 1;
            border-radius: 12px;
            background: var(--glass-bg);
            backdrop-filter: blur(50px) saturate(120%);
            -webkit-backdrop-filter: blur(50px) saturate(120%);

            border: 1px solid var(--glass-border);
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
            box-shadow:
                    0 0 0 1px rgba(255, 255, 255, 0.1),
                    0 30px 80px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Controls */
        #controls {
            display: flex;
            align-items: center;
            height: 60px;
            padding: 0 24px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 100;
        }

        .controls-left {
            display: flex;
            gap: 12px;
            align-items: center;
            flex: 1;
            color: var(--ice-white);
        }

        .controls-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            color: var(--ice-white);
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .controls-right {
            display: flex;
            gap: 12px;
            align-items: center;
            flex: 1;
            justify-content: flex-end;
            color: var(--ice-white);
        }

        /* 进度条 */
        .progress-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            height: 2px;
            z-index: 101;
        }

        #loadingProgress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, transparent, var(--ice-white));
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.7);
            transition: width 0.15s ease-out;
        }

        /* 控制按钮 */
        .control-btn {
            height: 34px;
            padding: 0 14px;
            border-radius: var(--radius-btn);
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.02);
            color: var(--ice-white);
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .control-text {
            font-size: 0.85rem;
            color: var(--secondary-text);
            letter-spacing: 0.5px;
        }

        /* 下拉菜单样式 */
        .shadow-select-container {
            position: relative;
            width: 170px;
        }

        .custom-select-trigger {
            height: 34px;
            padding: 0 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-btn);
            color: var(--ice-white);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .custom-select-trigger:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .custom-options {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: #111111;
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-btn);
            display: none;
            z-index: 1000;
            padding: 6px 0;
            list-style: none;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 1);
        }

        .custom-options.active {
            display: block;
            animation: fadeIn 0.2s ease;
        }

        .custom-options li {
            padding: 10px 16px;
            color: var(--secondary-text);
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .custom-options li:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* 数字输入框样式 */
        .form-control {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-btn);
            color: var(--ice-white);
            padding: 6px 12px;
            font-size: 0.85rem;
            height: 34px;
            width: 80px;
            text-align: center;
            transition: 0.3s;
        }

        .form-control:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .form-control:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1);
        }

        /* 查看器区域 - 修复关键部分 */
        #viewerWrapper {
            flex: 1;
            position: relative;
            overflow: auto;
            background: rgba(0, 0, 0, 0.1);
            padding: 40px 50px 40px 50px; /* 保持固定padding */
        }

        #viewer {
            display: inline-block; /* 改为inline-block，让表格自然大小 */
            transform-origin: 0 0; /* 缩放时从左上角开始 */
            transition: transform 0.2s ease;
            min-width: 100%;
            position: relative;
        }

        /* 表格样式 */
        #viewer table {
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            overflow: hidden;
            min-width: 100%;
        }

        #viewer th {
            background: rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.15);
            padding: 8px 12px;
            white-space: nowrap;
            text-align: left;
            font-weight: 600;
            color: #000;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        #viewer td {
            border: 1px solid rgba(0, 0, 0, 0.1);
            padding: 6px 12px;
            white-space: nowrap;
            text-align: left;
            color: #000;
            background: rgba(255, 255, 255, 0.8);
        }

        #viewer tr:hover td {
            background: rgba(0, 123, 255, 0.1);
        }

        /* 滚动条样式 */
        #viewerWrapper::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        #viewerWrapper::-webkit-scrollbar-thumb {
            background: var(--silver-mercury);
            border-radius: 10px;
        }

        #viewerWrapper::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        /* 错误信息 */
        .error-msg {
            color: #ff6b6b;
            font-weight: 600;
            font-size: 1rem;
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(255, 107, 107, 0.2);
        }

        /* Loading 动画 */
        @font-face {
            font-family: 'Segoe Boot Semilight';
            src: url('/lib/fonts/segoe_slboot.ttf') format('truetype');
        }

        #bootOverlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--background-dark);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .boot-spinner {
            font-family: 'Segoe Boot Semilight';
            font-size: 42px;
            color: var(--ice-white);
            line-height: 1;
        }

        /* 缩放指示器 */
        #zoomLevel {
            min-width: 60px;
            text-align: center;
            color: var(--ice-white);
            font-weight: 500;
        }

        /* 工作表指示器 */
        #sheetIndicator {
            color: var(--ice-white);
            font-weight: 500;
        }
    </style>
    <th:block th:replace="~{common/sub/iviep/iviep-common.html}"></th:block>
    <th:block th:replace="~{common/sub/iviep/lib/view-history :: viewhist}"></th:block>
</head>
<body>
<th:block th:replace="~{common/sub/iviep/iviep-header :: header}"></th:block>

<div class="excel-wrap">
    <div id="excelContainer">
        <!-- 加载动画 -->
        <div id="bootOverlay">
            <div class="boot-spinner" id="bootAnim"></div>
        </div>

        <!-- 控制栏 -->
        <div id="controls">
            <div class="controls-left">
                <div id="sheetIndicator" style="cursor:default">Sheet: </div>
                <div class="shadow-select-container" id="sheetDropdown">
                    <div class="custom-select-trigger">
                        <span id="selectedSheet">Select Sheet</span>
                        <i class="bi bi-chevron-down" style="font-size: 0.7rem; opacity: 0.5;"></i>
                    </div>
                    <ul class="custom-options" id="sheetOptions"></ul>
                </div>
            </div>
            <div class="controls-center">
                <button class="control-btn" id="zoomOutBtn" title="Zoom Out">
                    <i class="bi bi-dash-lg"></i>
                </button>
                <div id="zoomLevel" class="control-text">100%</div>
                <button class="control-btn" id="zoomInBtn" title="Zoom In">
                    <i class="bi bi-plus-lg"></i>
                </button>
                <button class="control-btn" id="resetZoomBtn" title="Reset Zoom">
                    <i class="bi bi-arrow-clockwise"></i>
                </button>
            </div>
            <div class="controls-right">
                <button class="control-btn" id="downloadBtn" title="Download">
                    <i class="bi bi-download"></i>
                </button>
            </div>
        </div>

        <!-- 进度条 -->
        <div class="progress-container">
            <div id="loadingProgress"></div>
        </div>

        <!-- 查看器区域 -->
        <div id="viewerWrapper">
            <div id="viewer"></div>
        </div>
    </div>
</div>

<script src="/lib/jquery-3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>

<script>
    (async () => {
        const viewer = document.getElementById("viewer");
        const sheetOptions = document.getElementById("sheetOptions");
        const selectedSheet = document.getElementById("selectedSheet");
        const sheetDropdown = document.getElementById("sheetDropdown");
        const zoomLevel = document.getElementById("zoomLevel");
        const downloadBtn = document.getElementById("downloadBtn");
        const zoomInBtn = document.getElementById("zoomInBtn");
        const zoomOutBtn = document.getElementById("zoomOutBtn");
        const resetZoomBtn = document.getElementById("resetZoomBtn");
        const sheetIndicator = document.getElementById("sheetIndicator");
        const progressBar = document.getElementById("loadingProgress");
        const container = document.getElementById("excelContainer");
        const bootOverlay = document.getElementById("bootOverlay");
        const sheetTrigger = document.querySelector('.custom-select-trigger');
        const viewerWrapper = document.getElementById("viewerWrapper");

        const workbook = new ExcelJS.Workbook();
        const FILE_PATH = "[[${file != null ? file.filePath : ''}]]";
        const FILE_TYPE = "[[${file != null ? file.type : ''}]]".toLowerCase();

        let currentZoom = 100;
        let currentSheetIndex = 0;
        let worksheetNames = [];

        // 加载动画
        function startAnim() {
            const el = document.getElementById('bootAnim');
            let curr = 0xE052;
            return setInterval(() => {
                el.innerText = String.fromCharCode(curr);
                if (++curr > 0xE0CB) curr = 0xE052;
            }, 40);
        }

        // ARGB转CSS颜色
        function argbToCss(argb) {
            if (!argb) return null;
            return "#" + (argb.length === 8 ? argb.slice(2) : argb);
        }

        async function loadExcel(url) {
            const animId = startAnim();

            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error("Excel file load failed");

                if (FILE_TYPE === "xls") {
                    viewer.innerHTML = `<div class="error-msg">
                        Format Incompatible: Legacy .xls format cannot be rendered. Please download.
                    </div>`;

                    clearInterval(animId);
                    $("#bootOverlay").fadeOut(600, function() {
                        $().remove();
                    });
                    return;
                }

                const buf = await res.arrayBuffer();
                await workbook.xlsx.load(buf);

                populateSheetSelect();
                renderSheet(0);

                clearInterval(animId);
                $("#bootOverlay").fadeOut(600, function () {
                    $().remove();
                });

            } catch(e) {
                viewer.innerHTML = `<div class="error-msg">${e.message}</div>`;
                clearInterval(animId);
                $("#bootOverlay").fadeOut(600, function () {
                    $().remove();
                });
            }
        }

        function populateSheetSelect() {
            sheetOptions.innerHTML = "";
            worksheetNames = [];

            workbook.worksheets.forEach((ws, idx) => {
                worksheetNames.push(ws.name);

                const option = document.createElement("li");
                option.setAttribute("data-value", idx);
                option.textContent = ws.name;
                sheetOptions.appendChild(option);
            });

            // 设置第一个工作表为选中状态
            if (worksheetNames.length > 0) {
                selectedSheet.textContent = worksheetNames[0];
            }

            // 添加下拉菜单点击事件
            sheetTrigger.addEventListener('click', (e) => {
                e.stopPropagation();
                sheetOptions.classList.toggle('active');
            });

            // 添加工作表选择事件
            sheetOptions.querySelectorAll('li').forEach(item => {
                item.addEventListener('click', (e) => {
                    const idx = parseInt(e.target.getAttribute('data-value'));
                    selectedSheet.textContent = worksheetNames[idx];
                    sheetOptions.classList.remove('active');
                    renderSheet(idx);
                });
            });

            // 点击其他地方关闭下拉菜单
            document.addEventListener('click', () => {
                sheetOptions.classList.remove('active');
            });
        }

        function renderSheet(idx) {
            const ws = workbook.worksheets[idx];
            currentSheetIndex = idx;

            viewer.innerHTML = "";
            const table = document.createElement("table");

            // 创建列组
            const colgroup = document.createElement("colgroup");
            ws.columns.forEach(col => {
                const c = document.createElement("col");
                if (col?.width) c.style.width = (col.width * 7) + "px";
                colgroup.appendChild(c);
            });
            table.appendChild(colgroup);

            // 处理每一行
            ws.eachRow({ includeEmpty: true }, row => {
                const tr = document.createElement("tr");
                if (row.height) tr.style.height = row.height + "px";

                row.eachCell({ includeEmpty: true }, cell => {
                    const td = document.createElement(cell.row === 1 ? "th" : "td");
                    td.textContent = cell.value ?? "";

                    // 设置单元格样式
                    if (cell.style) {
                        td.style.backgroundColor = argbToCss(cell.style.fill?.fgColor?.argb) ||
                            (cell.row === 1 ? "rgba(0,0,0,0.05)" : "rgba(255,255,255,0.8)");
                        td.style.color = argbToCss(cell.style.font?.color?.argb) || "#000";

                        if (cell.style.font?.bold) {
                            td.style.fontWeight = "bold";
                        }
                    }

                    // 合并单元格
                    if (cell._mergeCount) {
                        td.colSpan = cell._mergeCount.colSpan || 1;
                        td.rowSpan = cell._mergeCount.rowSpan || 1;
                    }

                    tr.appendChild(td);
                });

                table.appendChild(tr);
            });

            viewer.appendChild(table);

            // 应用当前缩放
            applyZoom();

            // 更新工作表指示器
            selectedSheet.textContent = ws.name;
        }

        function applyZoom() {
            const scale = currentZoom / 100;
            viewer.style.transform = `scale(${scale})`;
            zoomLevel.textContent = `${currentZoom}%`;
        }

        // 事件监听器
        zoomInBtn.addEventListener("click", () => {
            if (currentZoom < 200) {
                currentZoom += 10;
                applyZoom();
            }
        });

        zoomOutBtn.addEventListener("click", () => {
            if (currentZoom > 50) {
                currentZoom -= 10;
                applyZoom();
            }
        });

        resetZoomBtn.addEventListener("click", () => {
            currentZoom = 100;
            applyZoom();
        });

        downloadBtn.addEventListener("click", async () => {
            try {
                const res = await fetch(FILE_PATH);
                if (!res.ok) throw new Error("Download failed");
                const blob = await res.blob();
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = FILE_PATH.split("/").pop();
                a.click();
                URL.revokeObjectURL(a.href);
            } catch(e) {
                alert("Download failed: " + e.message);
            }
        });

        // 滚动进度条和动态边框
        viewerWrapper.addEventListener('scroll', () => {
            const scrolled = viewerWrapper.scrollTop;
            const total = viewerWrapper.scrollHeight - viewerWrapper.clientHeight;
            const progress = total <= 0 ? 0 : scrolled / total;

            progressBar.style.width = (progress * 100) + "%";

            // 动态调整边框亮度
            const glowIntensity = 0.08 + (progress * 0.12);
            const shadowIntensity = 0.8 + (progress * 0.1);
            container.style.borderColor = `rgba(255, 255, 255, ${glowIntensity})`;
            container.style.boxShadow = `0 0 0 1px rgba(255, 255, 255, ${glowIntensity / 2}), 0 40px 100px rgba(0,0,0,${shadowIntensity})`;
        });

        // 鼠标滚轮缩放
        viewerWrapper.addEventListener('wheel', (e) => {
            if (e.ctrlKey) {
                e.preventDefault();
                if (e.deltaY < 0 && currentZoom < 200) {
                    currentZoom += 10;
                    applyZoom();
                } else if (e.deltaY > 0 && currentZoom > 50) {
                    currentZoom -= 10;
                    applyZoom();
                }
            }
        }, { passive: false });

        // 初始化加载
        loadExcel(FILE_PATH);

    })();
</script>

</body>
</html>
