# ==================== 关于（About） ====================
insightful.about.title=เกี่ยวกับ บทแห่งปัญญา
insightful.about.header=บทแห่งปัญญา — แพลตฟอร์มสำหรับการแบ่งปันความรู้และการเรียนรู้
insightful.about.aboutUs=เกี่ยวกับเรา
insightful.about.description=บทแห่งปัญญาเป็นแพลตฟอร์มสมัยใหม่สำหรับการแบ่งปันความรู้และการเรียนรู้ ที่ผู้ใช้สามารถอัปโหลดทรัพยากรการเรียนรู้และแชร์ให้ผู้อื่นหลังจากการตรวจสอบ แพลตฟอร์มนี้ออกแบบมาเพื่อช่วยให้บุคคลและชุมชนรวบรวม จัดระเบียบ และสำรวจเนื้อหาความรู้คุณภาพสูง รวมถึงเอกสาร โค้ด สื่อ และบันทึกต่างๆ อย่างเป็นระบบและยั่งยืน
insightful.about.mission=พันธกิจของเรา
insightful.about.missionDesc=พันธกิจของเราคือการสร้างสภาพแวดล้อมการแบ่งปันความรู้ที่เปิดกว้างและน่าเชื่อถือ โดยเปลี่ยนเนื้อหาคุณภาพสูงที่ผู้ใช้มีส่วนร่วมให้กลายเป็นฐานความรู้สาธารณะที่เติบโตอย่างต่อเนื่องสำหรับการเรียนรู้และการอ้างอิง
insightful.about.features=คุณสมบัติของเรา
insightful.about.feature1=ระบบอัปโหลดและตรวจสอบทรัพยากรของผู้ใช้
insightful.about.feature2=แพลตฟอร์มสำหรับแชร์เนื้อหาคุณภาพสูง
insightful.about.feature3=ทรัพยากรการเรียนรู้หลายรูปแบบ (เอกสาร โค้ด สื่อ บันทึก)
insightful.about.feature4=การจัดระเบียบความรู้แบบมีโครงสร้าง
insightful.about.feature5=การค้นหา การอ่าน และการสรุปด้วย AI
insightful.about.impact=ผลกระทบของเรา
insightful.about.impactDesc=บทแห่งปัญญาช่วยให้ผู้ใช้สามารถแชร์วัสดุการเรียนรู้ที่มีคุณค่าให้กับผู้อื่น และได้รับประโยชน์จากทรัพยากรชุมชนคุณภาพสูง ผ่านการตรวจสอบเนื้อหาและการจัดระเบียบอย่างมีโครงสร้าง แพลตฟอร์มช่วยให้ผู้เรียนเข้าถึงความรู้ที่น่าเชื่อถือได้อย่างมีประสิทธิภาพมากขึ้น และส่งเสริมระบบนิเวศการแบ่งปันความรู้ที่เป็นบวก
insightful.about.future=แนวโน้มในอนาคต
insightful.about.futureDesc=ในอนาคต บทแห่งปัญญาจะยังคงพัฒนาระบบการตรวจสอบเนื้อหาและความสามารถในการจัดระเบียบความรู้ต่อไป พร้อมแนะนำเครื่องมือ AI เพิ่มเติมเพื่อช่วยให้ผู้ใช้ค้นพบ เข้าใจ และนำความรู้ที่แชร์ไปใช้งานซ้ำได้อย่างมีประสิทธิภาพมากขึ้น

