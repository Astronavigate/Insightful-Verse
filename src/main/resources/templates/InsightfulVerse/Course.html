<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insightful Verse Courses - List</title>
    <style>
        .dropdown-item:hover,
        .dropdown-item:active {
            border-radius: 24px;
            margin-left: 5px;
            margin-right: 6px;
            width: calc(100% - 11px);
            transition: 0.15s;
        }

        /* 收藏按钮基础样式 */
        .favorite-btn {
            transition: transform 0.2s ease, color 0.2s ease;
            outline: none;
        }
        .favorite-btn i{
            font-size: 1.2rem !important;
        }
        .favorite-btn:hover {
            transform: scale(1.1);
        }
        .text-warning {
            color: #ffc107 !important; /* 收藏后的明黄 */
        }
        .text-secondary {
            color: #6c757d !important; /* 未收藏时的冷灰 */
        }
    </style>
    <!-- 通用布局部分 -->
    <th:block th:replace="~{common/sub/iviep/iviep-common.html}"></th:block>
</head>
<body class="default">
<!-- 头部导航 -->
<th:block th:replace="~{common/sub/iviep/iviep-header :: header}"></th:block>

<div class="container" style="margin-top: 2rem; width: 70%; z-index: 20 !important;">
    <form class="input-group custom-dropdown liquid" style="margin-bottom: 0; z-index: 21 !important;" action="/InsightfulVerse/Search">
        <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false"
                style="border-top-left-radius: 24px; border-bottom-left-radius: 24px; border-width: 0; z-index: 22 !important;"
                th:text="#{insightful.search.type}">Search Type</button>
        <ul class="dropdown-menu liquid no-liquid-effect" style="z-index: 23 !important;">
            <li><a class="dropdown-item" id="searchAll" th:text="#{insightful.search.all}">All</a></li>
            <li><a class="dropdown-item" id="searchCourse" th:text="#{insightful.search.course}">Course</a></li>
            <li><a class="dropdown-item" id="searchFile" th:text="#{insightful.search.file}">File</a></li>
        </ul>
        <input id="searchType" name="type" th:value="${type}" hidden>
        <input type="text" class="form-control" th:placeholder="#{insightful.search.keywordPlaceholder}" name="keyword" th:value="${keyword}">
        <button class="btn btn-outline-secondary" type="submit" id="button-addon2"
                style="border-top-right-radius: 24px; border-bottom-right-radius: 24px; border-width: 0"
                th:text="#{insightful.search.button}">Search</button>
    </form>
</div>

<div class="content" id="content">
    <div class="rectangle-container" id="coursesPlace">
        <th:block th:if="${session.user != null and (session.user.authority == 'admin' or session.user.authority == 'infinite')}">
            <div class="rectangle liquid" style="text-decoration: none; color: black" data-bs-toggle="modal"
                 data-bs-target="#updCourseForm">
                <div class="cont">
                    <i class="bi-plus" style="font-size: 4rem; color: gray;"></i>
                    <h5 th:text="#{insightful.course.add}">Add a new course</h5>
                </div>
            </div>
        </th:block>

        <th:block th:each="course : ${courseList}">
            <a class="rectangle liquid" th:id="|cs${course.courseId}|" th:href="@{/InsightfulVerse/CourseInfo(courseId=${course.courseId})}" style="text-decoration: none; color: black">
                <div class="cont">
                    <th:block th:if="${session.user != null}">
                        <button type="button"
                                class="favorite-btn"
                                th:data-id="${course.courseId}"
                                th:data-type="course"
                                th:data-favorited="${course.isFavorite}"
                                style="position: absolute; top: 10px; right: 10px; background: none; border: none; z-index: 30;">
                            <i th:class="${course.isFavorite} ? 'bi-star-fill text-warning' : 'bi-star text-secondary'"
                               style="font-size: 1.5rem;"></i>
                        </button>
                        <th:block th:if="${session.user.authority == 'admin' or session.user.authority == 'infinite'}">
                            <button type="button" class="btn btn-warning edit-course-btn" data-bs-toggle="modal" data-bs-target="#updCourseForm"
                                    th:data-course-id="${course.courseId}" th:data-course-name="${course.courseName}" th:data-course-info="${course.courseInfo}"
                                    th:text="#{insightful.course.edit}">Edit</button>
                            <button type="button" class="btn btn-danger del-course-btn" data-bs-toggle="modal" data-bs-target="#delCourseForm"
                                    th:data-course-id="${course.courseId}" th:data-course-name="${course.courseName}"
                                    th:text="#{insightful.course.delete}">Delete</button>
                        </th:block>
                    </th:block>
                    <h5 th:text="${course.courseName}">Name</h5>
                    <p th:text="${course.courseInfo}">Information</p>
                </div>
            </a>
        </th:block>
    </div>
</div>

<!-- 模态框部分 -->
<th:block th:if="${session.user != null and (session.user.authority == 'admin' or session.user.authority == 'infinite')}">
    <!-- 删除课程模态框 -->
    <div class="modal fade" id="delCourseForm" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="del-course-name" th:text="#{insightful.course.modalTitle.delete}">Delete Course</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" th:text="#{insightful.course.modalBody.delete}">
                    Are you sure you want to delete this course? <br>The deleted data cannot be recovered.
                </div>
                <form th:action="@{/InsightfulVerse/DelCourse}">
                    <input type="hidden" id="del-course-id" name="courseId" value="" />
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" th:text="#{insightful.course.button.cancel}">Cancel</button>
                        <button type="submit" class="btn btn-danger" th:text="#{insightful.course.button.delete}">Delete</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 编辑课程模态框 -->
    <div class="modal fade" id="updCourseForm" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fs-5" th:text="#{insightful.course.modalTitle.edit}">Course Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form action="/InsightfulVerse/UpdCourse">
                    <div class="modal-body">
                        <input type="hidden" id="upd-course-id" name="courseId" value="">
                        <div class="mb-3">
                            <label for="upd-course-name" class="form-label" th:text="#{insightful.course.name}">Course Name</label>
                            <input type="text" class="form-control" id="upd-course-name" name="courseName" value="">
                        </div>
                        <div class="mb-6">
                            <label for="upd-course-info" class="form-label" th:text="#{insightful.course.info}">Course Introduction</label>
                            <textarea class="form-control" id="upd-course-info" name="courseInfo" rows="5"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" th:text="#{insightful.course.button.cancel}">Cancel</button>
                        <button type="submit" class="btn btn-warning" th:text="#{insightful.course.button.save}">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</th:block>

<div class="blank"></div>

<!-- 脚部导航 -->
<th:block th:replace="~{common/sub/iviep/iviep-footer :: footer}"></th:block>

<!-- 自定义脚本 -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // -------------------- 搜索类型按钮 --------------------
        const buttonAll = document.getElementById('searchAll');
        const buttonCourse = document.getElementById('searchCourse');
        const buttonFile = document.getElementById('searchFile');
        const type = document.getElementById('searchType');

        function handleButtonClick(selectedButton, typeVal) {
            buttonAll.style.fontWeight = 'normal';
            buttonCourse.style.fontWeight = 'normal';
            buttonFile.style.fontWeight = 'normal';
            selectedButton.style.fontWeight = 'bold';
            type.value = typeVal;
        }

        if (type.value === "file") {
            handleButtonClick(buttonFile, 'file');
        } else if (type.value === "course") {
            handleButtonClick(buttonCourse, 'course');
        } else {
            handleButtonClick(buttonAll, 'all');
        }

        buttonAll.addEventListener('click', () => handleButtonClick(buttonAll, 'all'));
        buttonCourse.addEventListener('click', () => handleButtonClick(buttonCourse, 'course'));
        buttonFile.addEventListener('click', () => handleButtonClick(buttonFile, 'file'));

        // -------------------- 收藏功能 --------------------
        document.querySelectorAll('.favorite-btn').forEach(btn => {
            btn.addEventListener('click', function(event) {
                event.preventDefault(); // 阻止 a 标签跳转
                event.stopPropagation(); // 阻止事件冒泡

                const id = this.getAttribute('data-id');
                const type = this.getAttribute('data-type');

                // 构造跳转链接
                // 参数1: id, 参数2: type
                const targetUrl = `/InsightfulVerse/Favorite.do?id=${id}&type=${type}`;

                // 执行跳转
                window.location.href = targetUrl;
            });
        });

        // -------------------- 阻止 <a> 内按钮跳转 --------------------
        document.querySelectorAll('a.rectangle').forEach(link => {
            link.querySelectorAll('button').forEach(button => {
                button.addEventListener('click', function(event) {
                    event.preventDefault();
                    event.stopPropagation();
                });
            });
        });

        // -------------------- 编辑课程 --------------------
        document.querySelectorAll('.edit-course-btn').forEach(button => {
            button.addEventListener('click', function() {
                document.getElementById('upd-course-id').value = button.getAttribute('data-course-id');
                document.getElementById('upd-course-name').value = button.getAttribute('data-course-name');
                document.getElementById('upd-course-info').value = button.getAttribute('data-course-info');
            });
        });

        // -------------------- 删除课程 --------------------
        document.querySelectorAll('.del-course-btn').forEach(button => {
            button.addEventListener('click', function() {
                document.getElementById('del-course-id').value = button.getAttribute('data-course-id');
                document.getElementById('del-course-name').innerText = "Delete Course " + button.getAttribute('data-course-name');
            });
        });

        // -------------------- 清空模态框 --------------------
        const modals = ['updCourseForm', 'delCourseForm'];
        modals.forEach(modalId => {
            let modalEl = document.getElementById(modalId);
            modalEl.addEventListener('hidden.bs.modal', function () {
                document.getElementById('upd-course-id').value = '';
                document.getElementById('upd-course-name').value = '';
                document.getElementById('upd-course-info').value = '';
                document.getElementById('del-course-id').value = '';
                document.getElementById('del-course-name').innerText = 'Delete Course';
            });
        });
    });
</script>
</body>
</html>
