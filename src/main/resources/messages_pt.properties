# ==================== About ====================
insightful.about.title=Sobre Capítulo da Sabedoria
insightful.about.header=Capítulo da Sabedoria — Uma plataforma de compartilhamento de conhecimento e aprendizado
insightful.about.aboutUs=Sobre nós
insightful.about.description=Capítulo da Sabedoria é uma plataforma moderna de compartilhamento de conhecimento e aprendizado, onde os usuários podem enviar recursos de aprendizado e compartilhá-los com outros após revisão. A plataforma foi projetada para ajudar indivíduos e comunidades a coletar, organizar e explorar conteúdos de alta qualidade, incluindo documentos, código, mídia e anotações, de forma estruturada e sustentável.
insightful.about.mission=Nossa missão
insightful.about.missionDesc=Nossa missão é construir um ambiente aberto e confiável de compartilhamento de conhecimento, transformando conteúdos de alta qualidade fornecidos pelos usuários em uma base pública de conhecimento em crescimento contínuo para aprendizado e referência.
insightful.about.features=Nossas funcionalidades
insightful.about.feature1=Sistema de envio e revisão de recursos do usuário
insightful.about.feature2=Plataforma de compartilhamento de conteúdos de alta qualidade
insightful.about.feature3=Recursos de aprendizado em múltiplos formatos (documentos, código, mídia, anotações)
insightful.about.feature4=Organização estruturada do conhecimento
insightful.about.feature5=Pesquisa, leitura e resumo assistidos por IA
insightful.about.impact=Nosso impacto
insightful.about.impactDesc=Capítulo da Sabedoria permite que os usuários compartilhem materiais de aprendizado valiosos com outros e se beneficiem de recursos comunitários de alta qualidade. Através da revisão de conteúdo e organização estruturada, a plataforma ajuda os aprendizes a acessar conhecimento confiável de forma mais eficiente e promove um ecossistema positivo de compartilhamento de conhecimento.
insightful.about.future=Perspectivas futuras
insightful.about.futureDesc=No futuro, Capítulo da Sabedoria continuará a melhorar seu sistema de revisão de conteúdo e capacidades de organização do conhecimento, introduzindo mais ferramentas baseadas em IA para ajudar os usuários a descobrir, compreender e reutilizar o conhecimento compartilhado de forma mais eficaz.

