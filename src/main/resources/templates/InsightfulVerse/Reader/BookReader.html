<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title th:text="'Insightful EPUB Reader ' + ${file != null ? ' - ' + file.fileName : 'None'}">EPUB Reader</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>

    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}"/>

    <script src="/lib/jquery-3.7.1/dist/jquery.min.js"></script>
    <script src="/lib/jszip-3.10.1/dist/jszip.min.js"></script>
    <script src="/lib/epub.js-0.3.88/epub.min.js"></script>

    <style>
        :root {
            --header-h: 72px;
            --glass-bg: rgba(18, 18, 18, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary-text: #e6eef8;
            --secondary-text: #adb5bd;
            --background-dark: #050505;
            --ice-white: #ffffff;
            --silver-mercury: rgba(255, 255, 255, 0.35);
            --radius-btn: 8px;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background: var(--background-dark) !important;
            color: var(--primary-text);
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }

        .reader-wrap {
            height: calc(100vh - var(--header-h));
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 24px;
            box-sizing: border-box;
            align-items: center;
        }

        #epubContainer {
            width: 100%;
            max-width: 1400px;
            flex: 1;
            border-radius: 12px;
            background: var(--glass-bg);
            backdrop-filter: blur(50px) saturate(120%);
            -webkit-backdrop-filter: blur(50px) saturate(120%);

            border: 1px solid var(--glass-border);
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
            box-shadow:
                    0 0 0 1px rgba(255, 255, 255, 0.1),
                    0 30px 80px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #controls {
            display: flex;
            align-items: center;
            height: 60px;
            padding: 0 24px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 100;
        }

        .controls-left {
            display: flex;
            gap: 12px;
            align-items: center;
            flex: 1;
            color: var(--ice-white);
        }

        .controls-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            color: var(--ice-white);
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .controls-right {
            display: flex;
            gap: 12px;
            align-items: center;
            flex: 1;
            justify-content: flex-end;
            color: var(--ice-white);
        }

        /* 进度条 */
        .progress-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            height: 2px;
            z-index: 101;
        }

        #loadingProgress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, transparent, var(--ice-white));
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.7);
            transition: width 0.15s ease-out;
        }

        /* 控制按钮 */
        .control-btn {
            height: 34px;
            padding: 0 14px;
            border-radius: var(--radius-btn);
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.02);
            color: var(--ice-white);
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .control-text {
            font-size: 0.85rem;
            color: var(--secondary-text);
            letter-spacing: 0.5px;
        }

        /* Loading 动画 */
        @font-face {
            font-family: 'Segoe Boot Semilight';
            src: url('/lib/fonts/segoe_slboot.ttf') format('truetype');
        }

        #bootOverlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--background-dark);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .boot-spinner {
            font-family: 'Segoe Boot Semilight';
            font-size: 42px;
            color: var(--ice-white);
            line-height: 1;
        }

        /* 缩放指示器 */
        #zoomLevel {
            min-width: 60px;
            text-align: center;
            color: var(--ice-white);
            font-weight: 500;
        }

        #viewerWrapper {
            flex:1;
            display:flex;
            background:linear-gradient(180deg,#0a0a0a,#0b0b0b);
            border-top:1px solid var(--border-subtle);
            position:relative;
        }
        #viewer { flex:1; width:100%; height:100%; display:flex; justify-content:center; align-items:center; }
        #viewer iframe { background:#0a0a0a !important; }

        #tocDrawer {
            position:absolute;
            left:16px;
            top:16px;
            bottom:16px;
            width:360px;
            max-width:36%;
            background:rgba(32,32,32,0.8);
            border-radius:12px;
            backdrop-filter:blur(8px);
            border:1px solid rgba(255,255,255,0.04);
            overflow:auto;
            padding:12px;
            display:none;
            z-index:1200;
            color:var(--secondary-text);
            box-shadow:0 8px 40px rgba(0,0,0,0.8);
        }
        #tocDrawer h3 {
            margin:0 0 8px 0;
            color:#fff;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:8px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 8px;
        }
        #tocList { margin-top:8px; }
        .toc-item {
            padding:8px 10px;
            border-radius:6px;
            cursor:pointer;
            color:var(--secondary-text);
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:8px;
            transition: background 0.15s;
        }
        .toc-item:hover { background:rgba(255,255,255,0.05); color:var(--primary-text); }
        .bookmark-label { color:#80a2ff; font-weight:600; }
        .toc-children { margin-left:8px; }

        #tocDrawer::-webkit-scrollbar { width:8px; height:8px; }
        #tocDrawer::-webkit-scrollbar-track { background: rgba(224,224,224,0.2); border-radius:6px; }
        #tocDrawer::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius:6px; }
        #tocDrawer::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.6); }

        .icon-btn { border:none; background:transparent; color:var(--secondary-text); cursor:pointer; padding:4px; border-radius:6px; transition: all 0.15s; }
        .icon-btn:hover { background: rgba(255,255,255,0.08); color:var(--primary-text); }

        .error-msg { color:#93c5fd; padding:16px; text-align:center; font-weight:600; }

        .color-swatch {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: border-color 0.2s;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        .color-swatch:hover {
            border-color: #e6eef8;
        }
        .color-swatch.active {
            border-color: #6495ED !important;
            box-shadow: 0 0 8px #6495ED;
        }
    </style>
    <th:block th:replace="~{common/sub/iviep/iviep-common.html}"></th:block>
    <th:block th:replace="~{common/sub/iviep/lib/view-history :: viewhist}"></th:block>
</head>

<div class="modal fade" id="bookmarkModal" tabindex="-1" aria-labelledby="bookmarkModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="background: #181818; border: 1px solid rgba(255,255,255,0.1);">
            <div class="modal-header" style="border-bottom: 1px solid rgba(255,255,255,0.15);">
                <h5 class="modal-title" id="bookmarkModalLabel" style="color: #fff;"><i class="bi bi-bookmark me-2"></i>MARK Current Location</h5>

<div class="modal fade" id="infoModal" tabindex="-1" aria-labelledby="infoModalLabel" aria-hidden="true">

<script th:inline="javascript">
    /*<![CDATA[*/
    var FILE_PATH = /*[[${file != null ? file.filePath : ''}]]*/ '';
    var FILE_ID  = /*[[${file != null ? file.fileId : ''}]]*/ '';
    var CURRENT_USER_ID = /*[[${session.user != null ? session.user.userId : 'null'}]]*/ null;
    /*]]>*/
</script>

<script>
    // 加载动画
    function startAnim() {
        const el = document.getElementById('bootAnim');
        let curr = 0xE052;
        return setInterval(() => {
            el.innerText = String.fromCharCode(curr);
            if (++curr > 0xE0CB) curr = 0xE052;
        }, 40);
    }

    // ==========================================
    // 1. 全局变量与 DOM 元素获取
    // ==========================================

    // CSRF 辅助函数
    function getCsrfHeaders() {
        try {
            const tokenMeta = document.querySelector('meta[name="_csrf"]');
            const headerMeta = document.querySelector('meta[name="_csrf_header"]');
            if (tokenMeta && headerMeta) {
                const token = tokenMeta.getAttribute('content');
                const headerName = headerMeta.getAttribute('content');
                const h = {};
                h[headerName] = token;
                return h;
            }
        } catch (e) {}
        return {};
    }

    // 界面元素
    const viewer = document.getElementById('viewer');
    const tocBtn = document.getElementById('tocBtn');
    const tocDrawer = document.getElementById('tocDrawer');
    const tocList = document.getElementById('tocList');
    const tocCloseBtn = document.getElementById('tocCloseBtn');

    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const bookmarkBtn = document.getElementById('bookmarkBtn');
    const highlightBtn = document.getElementById('highlightBtn');
    const eraserBtnEl = document.getElementById('eraserBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    // 模态框相关
    const infoModalElement = document.getElementById('infoModal');
    const highlightModalElement = document.getElementById('highlightModal');
    const bookmarkModalElement = document.getElementById('bookmarkModal');
    const infoModalTitle = document.getElementById('infoModalTitle');
    const infoModalBody = document.getElementById('infoModalBody');
    let infoModalConfirmBtn = document.getElementById('infoModalConfirmBtn');
    let infoModalCancelBtn = document.getElementById('infoModalCancelBtn');

    // Bootstrap Modal 实例
    let bookmarkModal = null, highlightModal = null, infoModal = null;
    if (typeof bootstrap !== 'undefined' && bootstrap.Modal) {
        bookmarkModal = new bootstrap.Modal(bookmarkModalElement, {});
        highlightModal = new bootstrap.Modal(highlightModalElement, {});
        infoModal = new bootstrap.Modal(infoModalElement, {});
    } else {
        console.error("Bootstrap JS not found. Modals will not function.");
    }

    // 表单元素
    const bookmarkForm = document.getElementById('bookmarkForm');
    const bookmarkLabelInput = document.getElementById('bookmarkLabel');

    const highlightForm = document.getElementById('highlightForm');
    const highlightNoteInput = document.getElementById('highlightNote');
    const highlightCfiRangeInput = document.getElementById('highlightCfiRange');
    const colorSelector = document.getElementById('colorSelector');

    // 核心逻辑变量
    let book = null;
    let rendition = null;
    let locationsGenerated = false;
    let readerReady = false;
    let stableBookId = null;

    // 状态管理
    const DEFAULT_HIGHLIGHT_COLOR = "rgba(255, 255, 0, 0.3)";
    let selectedHighlightColor = DEFAULT_HIGHLIGHT_COLOR;
    const STORAGE_PREFIX = "epub_annotations_";

    // 存储当前选区和相关信息
    let currentSelection = {
        cfiRange: null,
        contents: null,
        text: null
    };

    // 本地缓存服务端的高光列表
    let currentServerAnnotations = [];

    const progressBar = document.getElementById('loadingProgress');
    const container = document.getElementById('epubContainer');
    let progressUpdateInterval = null;
    let readingProgress = {
        current: 0,
        saved: 0,
        lastCfi: null
    };

    // ==========================================
    // 2. 辅助工具函数
    // ==========================================

    function showInfoModal(title, message, isConfirm = false, onConfirm = () => {}) {
        if (!infoModal) {
            isConfirm ? onConfirm(window.confirm(message)) : window.alert(message);
            return;
        }

        infoModalTitle.textContent = title;
        infoModalBody.innerHTML = message;

        infoModalConfirmBtn.textContent = isConfirm ? 'Confirm' : 'OK';
        infoModalCancelBtn.style.display = isConfirm ? 'inline-block' : 'none';

        const cloneConfirm = infoModalConfirmBtn.cloneNode(true);
        infoModalConfirmBtn.parentNode.replaceChild(cloneConfirm, infoModalConfirmBtn);
        infoModalConfirmBtn = cloneConfirm;

        const cloneCancel = infoModalCancelBtn.cloneNode(true);
        infoModalCancelBtn.parentNode.replaceChild(cloneCancel, infoModalCancelBtn);
        infoModalCancelBtn = cloneCancel;

        if (isConfirm) {
            infoModalConfirmBtn.addEventListener('click', () => { infoModal.hide(); onConfirm(true); }, { once: true });
            infoModalCancelBtn.addEventListener('click', () => { infoModal.hide(); onConfirm(false); }, { once: true });
        } else {
            infoModalConfirmBtn.addEventListener('click', () => { infoModal.hide(); onConfirm(); }, { once: true });
        }

        infoModal.show();
    }

    function isEpub(path) { return path && path.toLowerCase().endsWith('.epub'); }

    function getStableBookId() {
        if (typeof FILE_ID !== 'undefined' && FILE_ID && String(FILE_ID).trim() !== '') return String(FILE_ID);
        try { if (book && book.package && book.package.metadata && book.package.metadata.identifier) return book.package.metadata.identifier; } catch(e){}
        return FILE_PATH || 'unknown-book';
    }

    function saveAnnotationLocal(id, ann) {
        try {
            const arr = JSON.parse(localStorage.getItem(STORAGE_PREFIX+id) || "[]");
            arr.push(ann);
            localStorage.setItem(STORAGE_PREFIX+id, JSON.stringify(arr));
        } catch(e){ console.error(e); }
    }

    // ==========================================
    // 3. API 交互函数
    // ==========================================

    async function saveAnnotationToServer(ann, type) {
        try {
            const headers = Object.assign({ 'Content-Type': 'application/json' }, getCsrfHeaders());
            const res = await fetch('/api/annotation/save', {
                method: 'POST', credentials: 'same-origin', headers: headers, body: JSON.stringify(ann)
            });
            if (!res.ok) {
                console.warn(`save ${type} failed:`, res.status);
                saveAnnotationLocal(ann.bookId, ann);
            }
        } catch (e) {
            console.warn(`save ${type} error`, e);
            saveAnnotationLocal(ann.bookId, ann);
        }
    }

    async function deleteAnnotationFromServer(id) {
        try {
            const headers = Object.assign({ 'Content-Type': 'application/x-www-form-urlencoded' }, getCsrfHeaders());
            const res = await fetch(`/api/annotation/delete?id=${encodeURIComponent(id)}`, {
                method: 'POST', credentials: 'same-origin', headers: headers
            });
            return res.ok;
        } catch (e) {
            console.error('deleteAnnotationFromServer error', e);
            return false;
        }
    }

    // ==========================================
    // 4. CFI 重叠检测与高光管理
    // ==========================================

    function isCfiOverlap(cfiA, cfiB) {
        if (!cfiA || !cfiB) return false;
        if (cfiA === cfiB) return true;
        try {
            const rangeA = rendition.getRange(cfiA);
            const rangeB = rendition.getRange(cfiB);
            if (rangeA && rangeB) {
                return (rangeA.compareBoundaryPoints(Range.END_TO_START, rangeB) < 0) &&
                    (rangeA.compareBoundaryPoints(Range.START_TO_END, rangeB) > 0);
            }
        } catch (e) {
            return (cfiA.includes(cfiB) || cfiB.includes(cfiA));
        }
        return false;
    }

    function renderHighlights(annotations) {
        if (!rendition) return;

        const highlights = annotations.filter(a => a.type === 'highlight');

        highlights.forEach(a => {
            try {
                rendition.annotations.add('highlight', a.cfi, {}, null, 'db-highlight', {
                    fill: a.color || DEFAULT_HIGHLIGHT_COLOR,
                    'fill-opacity': '0.3',
                    'mix-blend-mode': 'multiply'
                });
            } catch (e) {
                console.warn('Failed to render highlight:', a.cfi, e);
            }
        });
    }

    // ==========================================
    // 5. 选区处理逻辑
    // ==========================================

    function storeSelection(cfiRange, contents) {
        if (!cfiRange) return;

        // 存储新的选区
        currentSelection = {
            cfiRange: cfiRange,
            contents: contents,
            text: null
        };

        // 尝试获取选区文本
        try {
            if (contents && contents.window) {
                const selection = contents.window.getSelection();
                currentSelection.text = selection.toString();
            }
        } catch(e) {
            console.warn('Failed to get selection text:', e);
        }
    }

    function clearSelection() {
        // 清除浏览器选区
        try {
            if (rendition && rendition.getContents) {
                rendition.getContents().forEach(c => {
                    if(c.window) c.window.getSelection().removeAllRanges();
                });
            }
        } catch(e) {}

        // 重置选区存储
        currentSelection = {
            cfiRange: null,
            contents: null,
            text: null
        };
    }

    /********************
     * TOC + Bookmarks
     ********************/
    async function loadBookmarksAndRenderToc() {
        try {
            const bookId = stableBookId || getStableBookId();
            stableBookId = bookId;
            let serverList = [];
            try {
                const res = await fetch(`/api/annotation/list?bookId=${encodeURIComponent(bookId)}`, { credentials: 'same-origin' });
                if (res.ok) serverList = await res.json();
                else {
                    console.warn("annotation list server returned", res.status);
                }
            } catch (e) {
                console.warn("annotation list fetch error", e);
            }

            const bookmarks = serverList
                .filter(a => a.type === 'bookmark')
                .map((a, idx) => ({
                    id: 'bm-' + a.id,
                    label: (a.content && a.content.trim()) ? a.content : `Bookmark ${idx + 1}`,
                    href: a.cfi,
                    annotationId: a.id
                }));

            let baseToc = [];
            try {
                if (book && book.navigation && book.navigation.toc) baseToc = JSON.parse(JSON.stringify(book.navigation.toc));
                else if (book && book.loaded && book.loaded.navigation) {
                    const nav = await book.loaded.navigation;
                    baseToc = nav && nav.toc ? nav.toc : [];
                }
            } catch (e) { console.warn("get base toc fail", e); }

            const combined = [];
            if (bookmarks.length) {
                const bmItems = bookmarks.map(b => ({ label: b.label, href: b.href, annotationId: b.annotationId, isBookmark: true }));
                combined.push({ label: "📌 Bookmarks", href: null, subitems: bmItems });
            }
            baseToc.forEach(item => combined.push(item));

            renderTocDom(combined);

            serverList.filter(a => a.type === 'highlight').forEach(a => {
                try {
                    // Use a.color if defined, otherwise fall back to default
                    if (a.cfi && rendition) rendition.annotations.highlight(a.cfi, {}, () => {}, 'db-highlight', { fill: a.color || DEFAULT_HIGHLIGHT_COLOR });
                } catch (e) { console.warn("apply highlight fail", e); }
            });

        } catch (e) {
            console.error("loadBookmarksAndRenderToc error", e);
        }
    }

    // render combined TOC structure into DOM (recursive)
    function renderTocDom(tocArray) {
        tocList.innerHTML = '';
        const walk = (items, container, level=0) => {
            items.forEach(item => {
                const row = document.createElement('div');
                row.className = 'toc-item';
                row.style.paddingLeft = (8 + level * 12) + 'px';

                const left = document.createElement('div');
                left.style.display = 'flex';
                left.style.alignItems = 'center';
                left.style.gap = '8px';
                left.style.flex = '1';

                const label = document.createElement('span');
                label.textContent = item.label || item.title || 'Untitled';
                if (item.isBookmark) label.classList.add('bookmark-label');

                left.appendChild(label);

                const right = document.createElement('div');
                right.style.display = 'flex'; right.style.gap = '6px';

                if (item.isBookmark && item.annotationId) {
                    const delBtn = document.createElement('button');
                    delBtn.className = 'icon-btn';
                    delBtn.title = 'Delete bookmark';
                    delBtn.innerHTML = '<i class="bi bi-trash"></i>';
                    delBtn.onclick = async (ev) => {
                        ev.stopPropagation();
                        // 替换 confirm 为 showInfoModal
                        showInfoModal('Confirm Deletion', 'Delete this bookmark?', true, async (confirmed) => {
                            if (confirmed) {
                                await deleteBookmark(item.annotationId);
                            }
                        });
                    };
                    right.appendChild(delBtn);
                }

                row.appendChild(left);
                row.appendChild(right);

                row.onclick = (ev) => {
                    if (ev.target && ev.target.closest('.icon-btn')) {
                        ev.stopPropagation();
                        return;
                    }

                    if (item.href) {
                        try {
                            rendition.display(item.href).then(() => {
                                tocDrawer.style.display = 'none';
                            });
                        } catch (e) {
                            console.warn('TOC jump error', e);
                        }
                    } else if (item.label === "📌 Bookmarks" || item.subitems) {
                        console.log(`Ignoring click on group header: ${item.label}`);
                    }
                };

                container.appendChild(row);

                if (item.subitems && item.subitems.length) {
                    walk(item.subitems, container, level + 1);
                }
            });
        };

        walk(tocArray, tocList, 0);
    }

    async function deleteBookmark(annotationId) {
        try {
            const headers = Object.assign({ 'Content-Type': 'application/x-www-form-urlencoded' }, getCsrfHeaders());
            const res = await fetch(`/api/annotation/delete?id=${encodeURIComponent(annotationId)}`, {
                method: 'POST', credentials: 'same-origin', headers: headers
            });
            if (res.ok) {
                await loadBookmarksAndRenderToc();
            } else {
                const txt = await res.text().catch(()=>'(no body)');
                showInfoModal('Delete Failed', `Delete failed: ${res.status}. Details: ${txt.substring(0, 80)}`, false);
            }
        } catch (e) {
            console.error('deleteBookmark error', e);
            showInfoModal('Delete Failed', 'Delete failed: Network or unexpected error.', false);
        }
    }

    async function handleHighlightAction() {

            return;
        }

        // 重置颜色 UI
        colorSelector.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));

            highlightModal.show();
        }
    }

    async function handleEraserAction() {
        if (!currentSelection.cfiRange) {
            showInfoModal('No Selection', 'Please select text first, then click ERASE.', false);
            return;
        }

        const highlights = currentServerAnnotations.filter(a => a.type === 'highlight');
        let deletedCount = 0;

        for (const ann of highlights) {
            if (isCfiOverlap(currentSelection.cfiRange, ann.cfi)) {
                try {
                    rendition.annotations.remove(ann.cfi, 'highlight');
                } catch(e) { console.warn('Official remove failed', e); }

                const views = rendition.views();
                views.forEach(view => {
                    if (view.pane) {
                        view.pane.render();
                    }
                });

                const ok = await deleteAnnotationFromServer(ann.id);
                if(ok) deletedCount++;
            }
        }

        if (deletedCount > 0) {
            const currentLocation = rendition.currentLocation().start.cfi;
            rendition.display(currentLocation);

            showInfoModal('Eraser', `Successfully removed ${deletedCount} highlights.`);
            await refreshAnnotationsAndToc();
        } else {
            showInfoModal('Eraser', 'No highlights found in the selected area.', false);
        }

        clearSelection();
    }

    // ==========================================

    // ==========================================

    async function loadEpub(url) {
        const animId = startAnim();

        if (!isEpub(url)) {
            viewer.innerHTML = `<div class="error-msg">Unsupported format. Only .epub is accepted.</div>`;
            clearInterval(animId);
            $("#bootOverlay").fadeOut(600, function() {
                $().remove();
            });
            return;
        }
        viewer.innerHTML = '';

        try {
            book = ePub(url);

            rendition = book.renderTo('viewer', {
                width: '100%',
                height: '100%',
                spread: 'none',
                flow: 'paginated'
            });

            // 主题与样式
            try {
                rendition.themes.register('night', {
                    'body': { 'background': '#0a0a0a', 'color': '#ddd' },
                    'p': { 'color': '#ddd' },
                    '::selection': { 'background': 'rgba(255,255,0,0.3)' }
                });
                rendition.themes.select('night');
            } catch(e) {
                clearInterval(animId);
                $("#bootOverlay").fadeOut(600, function() {
                    $().remove();
                });
            }

            // 渲染回调
            rendition.on('rendered', (section, view) => {
                try {
                    if (view && view.document && view.document.body) {
                        view.document.body.style.backgroundColor = '#0a0a0a';
                        view.document.body.style.color = '#ddd';
                    }
                } catch (e) {
                    clearInterval(animId);
                    $("#bootOverlay").fadeOut(600, function() {
                        $().remove();
                    });
                }
            });

            // --- 关键修改：只存储选区，不立即处理 ---
            rendition.on('selected', (cfiRange, contents) => {
                storeSelection(cfiRange, contents);
            });

            // 启动渲染
            await rendition.display();

            // 后续加载
            readerReady = true;
            stableBookId = getStableBookId();
            setControlsEnabled(true);

            // 加载标注
            await refreshAnnotationsAndToc();

            // 生成 Locations
            if (!locationsGenerated) {
                await book.locations.generate().then(() => { locationsGenerated = true; }).catch(console.warn);

                locationsGenerated = true;

                // 加载保存的阅读进度
                loadSavedProgress();

                // 初始化进度追踪
                initializeProgressTracking();
            }

            clearInterval(animId);
            $("#bootOverlay").fadeOut(600, function() {
                $().remove();
            });
            return;

        } catch (e) {
            console.error('loadEpub error', e);
            viewer.innerHTML = `<div class="error-msg">Load Failed: ${e.message}</div>`;
            clearInterval(animId);
            $("#bootOverlay").fadeOut(600, function() {
                $().remove();
            });
        }
    }

    // ==========================================
    // 1. 添加EPUB进度追踪功能
    // ==========================================

    // 在全局变量部分添加


    // 移除原有的滚动监听（对EPUB无效）
    // viewerWrapper.addEventListener('scroll', () => { ... });

    // 计算EPUB阅读进度
    function calculateEpubProgress() {
        if (!readerReady || !rendition || !book.locations) return 0;

        try {
            const location = rendition.currentLocation();
            if (!location || !location.start) return readingProgress.current;

            // 获取当前CFI并计算百分比
            const cfi = location.start.cfi;
            const percentage = book.locations.percentageFromCfi(cfi);

            if (percentage !== null && percentage !== undefined) {
                const progress = Math.min(100, Math.max(0, Math.round(percentage * 100)));

                // 更新进度
                readingProgress.current = progress;
                readingProgress.lastCfi = cfi;

                return progress;
            }
        } catch (error) {
            console.warn("Progress calculation error:", error);
        }

        return readingProgress.current;
    }

    // 更新进度条显示
    function updateProgressDisplay(progress) {
        if (!progressBar) return;

        // 更新进度条宽度
        progressBar.style.width = `${progress}%`;

        // 动态调整边框亮度
        const glowIntensity = 0.08 + (progress / 100 * 0.12);
        const shadowIntensity = 0.8 + (progress / 100 * 0.1);
        container.style.borderColor = `rgba(255, 255, 255, ${glowIntensity})`;
        container.style.boxShadow = `0 0 0 1px rgba(255, 255, 255, ${glowIntensity / 2}), 0 40px 100px rgba(0,0,0,${shadowIntensity})`;
    }

    // 保存阅读进度到本地存储
    function saveReadingProgress() {
        try {
            const bookId = stableBookId || getStableBookId();
            const progressData = {
                progress: readingProgress.current,
                cfi: readingProgress.lastCfi,
                timestamp: new Date().toISOString(),
                bookId: bookId
            };

            localStorage.setItem(`epub_reading_progress_${bookId}`, JSON.stringify(progressData));
            readingProgress.saved = readingProgress.current;

            console.log(`Saved progress: ${readingProgress.current}%`);
        } catch (error) {
            console.warn("Failed to save reading progress:", error);
        }
    }

    // 加载保存的阅读进度
    function loadSavedProgress() {
        try {
            const bookId = stableBookId || getStableBookId();
            const savedData = localStorage.getItem(`epub_reading_progress_${bookId}`);

            if (savedData) {
                const progressData = JSON.parse(savedData);
                readingProgress.saved = progressData.progress || 0;

                // 如果进度超过5%，询问是否跳转
                if (readingProgress.saved > 5 && progressData.cfi) {
                    // 延迟显示弹窗，确保rendition已就绪
                    setTimeout(() => {
                        showInfoModal('Continue Reading?',
                            `You were at ${readingProgress.saved}% progress. Do you want to continue from where you left off?`,
                            true,
                            async (confirmed) => {
                                if (confirmed && progressData.cfi && rendition) {
                                    try {
                                        await rendition.display(progressData.cfi);
                                        // 更新进度显示
                                        const progress = calculateEpubProgress();
                                        updateProgressDisplay(progress);
                                        console.log(`Restored to position: ${progress}%`);
                                    } catch (error) {
                                        console.warn("Failed to restore reading position:", error);
                                    }
                                }
                            }
                        );
                    }, 1000);
                }

                // 立即显示保存的进度
                updateProgressDisplay(readingProgress.saved);
                console.log(`Loaded saved progress: ${readingProgress.saved}%`);
            }
        } catch (error) {
            console.warn("Failed to load reading progress:", error);
        }
    }

    // 自动保存阅读进度（每10秒或进度变化超过5%时保存）
    let lastSaveTime = 0;
    let lastSaveProgress = 0;
    function autoSaveReadingProgress() {
        const now = Date.now();
        const progressChanged = Math.abs(readingProgress.current - lastSaveProgress) > 5;
        const timePassed = now - lastSaveTime > 10000; // 10秒

        if (progressChanged || timePassed) {
            saveReadingProgress();
            lastSaveTime = now;
            lastSaveProgress = readingProgress.current;
        }
    }

    // 初始化进度追踪
    function initializeProgressTracking() {
        // 清除之前的间隔（如果有）
        if (progressUpdateInterval) {
            clearInterval(progressUpdateInterval);
        }

        // 每500毫秒更新一次进度显示
        progressUpdateInterval = setInterval(() => {
            if (readerReady && book.locations && locationsGenerated) {
                const progress = calculateEpubProgress();
                updateProgressDisplay(progress);

                // 自动保存进度
                autoSaveReadingProgress();
            }
        }, 500);

        // 监听EPUB页面变化事件
        if (rendition) {
            rendition.on('relocated', (location) => {
                const progress = calculateEpubProgress();
                updateProgressDisplay(progress);
            });

            rendition.on('rendered', (section, view) => {
                const progress = calculateEpubProgress();
                updateProgressDisplay(progress);
            });
        }
    }

    // 页面关闭前保存进度
    window.addEventListener('beforeunload', (e) => {
        if (readerReady && readingProgress.current > 0) {
            saveReadingProgress();
        }
    });

    // 页面可见性变化时保存进度
    document.addEventListener('visibilitychange', () => {
        if (document.hidden && readerReady && readingProgress.current > 0) {
            saveReadingProgress();
        }
    });
</script>
</body>
</html>
