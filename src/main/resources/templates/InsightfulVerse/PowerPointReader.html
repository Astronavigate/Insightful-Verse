<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Insightful Verse Reader ' + ${file != null ? ' - ' + file.fileName : 'None'}">Power Point Reader</title>

    <link rel="stylesheet" href="/lib/PPTXjs-1.21.1/css/pptxjs.css">
    <link rel="stylesheet" href="/lib/novus-nvd3-447cce8/build/nv.d3.min.css">

    <style>
        :root { --header-h: 72px; }

        body, html {
            margin:0; padding:0; height:100%;
            background-color: #0a0a0a;
            font-family: system-ui, sans-serif;
            color: #e0e0e0;
            overflow: hidden;
        }

        .ppt-wrap {
            height: calc(100vh - var(--header-h));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 32px 24px;
            box-sizing: border-box;
        }

        #pptContainer {
            width: 100%;
            height: 100%;
            max-width: 1400px;
            display: flex;
            flex-direction: column;
            border-radius: 16px;
            background-color: rgba(255,255,255,0.05); /* 玻璃效果更深 */
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
            overflow: hidden;
            padding: 16px;
            box-sizing: border-box;
            justify-content: flex-start;
            align-items: center; /* 内容水平居中 */
        }

        /* Controls */
        #controls {
            display: flex;
            align-items: center;
            width: 100%;
            justify-content: flex-end;
            gap: 12px;
            padding: 8px 12px;
            border-radius: 12px;
            margin-bottom: 12px;
            font-size:14px;
            background-color: rgba(72,72,72,0.6); /* 更深玻璃感 */
            backdrop-filter: blur(8px);
            color: #fff;
            box-sizing: border-box;
        }

        #controls button {
            height: 28px;
            padding: 0 12px;
            border: none;
            border-radius: 4px;
            background-color: #0d47a1;
            color: #e0e0e0;
            cursor: pointer;
            font-size: 0.875rem;
            transition: background-color 0.2s;
        }
        #controls button:hover {
            background-color: #1976d2;
        }

        /* Viewer */
        #viewerWrapper {
            flex:1;
            overflow:auto;
            border-radius:12px;
            background-color: rgba(72,72,72,0.4);
            padding:16px;
            width:100%;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        #pptx-viewer {
            width: 100%;
            height: 100%;
            overflow: auto;
        }

        .pptxjs { padding: 0 !important; }
        .pptxjs-slide { margin: 0 auto; }

        /* 可选滚动条样式 */
        #pptx-viewer::-webkit-scrollbar { width:12px; height:12px; }
        #pptx-viewer::-webkit-scrollbar-track { background: rgba(224,224,224,0.2); border-radius:6px; }
        #pptx-viewer::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius:6px; }
        #pptx-viewer::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.6); }
    </style>
    <th:block th:replace="~{common/sub/iviep/iviep-common.html}"></th:block>
    <th:block th:replace="~{common/sub/iviep/lib/view-history :: viewhist}"></th:block>
</head>
<body style="background-color: #0a0a0a;">
<th:block th:replace="~{common/sub/iviep/iviep-header :: header}"></th:block>

<div class="ppt-wrap">
    <div id="pptContainer">
        <div id="controls">
            <button id="downloadBtn">Download</button>
            <button id="fullScreenBtn">Full Screen</button>
        </div>
        <div id="viewerWrapper">
            <div id="pptx-viewer"></div>
        </div>
    </div>
</div>

<script src="/lib/jquery-3.7.1/dist/jquery.min.js"></script>
<script src="/lib/jszip-2.6.1/dist/jszip.min.js"></script>
<script src="/lib/PPTXjs-1.21.1/js/filereader.js"></script>
<script src="/lib/d3-3.5.17/d3.min.js"></script>
<script src="/lib/d3-3.5.17/d3.min.js"></script>
<script src="/lib/novus-nvd3-447cce8/build/nv.d3.min.js"></script>
<script src="/lib/PPTXjs-1.21.1/js/pptxjs.js"></script>
<script src="/lib/PPTXjs-1.21.1/js/divs2slides.js"></script>

<script>
    const FILE_PATH = "[[${file != null ? file.filePath : ''}]]"; // 或 Thymeleaf 替换路径

    $(function() {
        // 初始化 PPTXjs
        $("#pptx-viewer").pptxToHtml({
            pptxFileUrl: FILE_PATH,
            slideMode: false,
            keyBoardShortCut: true,
            mediaProcess: true,
            slidesScale: "100%"
        });

        // 下载按钮
        $("#downloadBtn").on("click", function() {
            const fileName = FILE_PATH.split("/").pop().split("?")[0];
            const a = document.createElement("a");
            a.href = FILE_PATH;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });

        // 全屏按钮
        $("#fullScreenBtn").on("click", function() {
            const elem = document.getElementById("pptx-viewer");
            if (elem.requestFullscreen) elem.requestFullscreen();
            else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
            else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
        });
    });
</script>

</body>
</html>
