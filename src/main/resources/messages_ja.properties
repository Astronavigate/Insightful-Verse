# ==================== About ====================
insightful.about.title=Insightful Verseについて
insightful.about.header=Insightful Verse インテリジェント教育プラットフォーム
insightful.about.aboutUs=私たちについて
insightful.about.description=Insightful Verse Intelligence Educating Platform（Insightful VerseまたはIVIEP）は、学習の方法と知識の伝達方法を革新する最先端の教育テクノロジープラットフォームです。あらゆる年齢や背景の学生にパーソナライズされた魅力的な学習体験を提供するというビジョンで設立され、Insightful Verseは学業およびキャリア目標を達成するために必要なツールとリソースを学習者に提供することを目的としています。
insightful.about.mission=私たちの使命
insightful.about.missionDesc=私たちの使命は、学生が自分の情熱を探求し、批判的思考能力を育み、生涯学習のための堅固な基盤を築ける包括的で協力的な学習環境を作ることです。
insightful.about.features=機能
insightful.about.feature1=パーソナライズされた学習パス
insightful.about.feature2=インタラクティブコンテンツ
insightful.about.feature3=協力学習
insightful.about.feature4=リアルタイムフィードバック
insightful.about.feature5=統合ツール
insightful.about.impact=影響
insightful.about.impactDesc=何千人もの学生が、パーソナライズされた学習パスとインタラクティブコンテンツの恩恵を受け、学業成績や学習への関与が向上しました。教師やメンターも、プラットフォームの効率と満足度が向上したと報告しています。
insightful.about.future=将来の展望
insightful.about.futureDesc=将来的には、学習者の変化するニーズに応えるため、機能やサービスの拡張を続ける予定です。人工知能や機械学習などの先進技術を導入し、学習体験をさらに個別化し、学生により効果的なツールを提供することを目指しています。


