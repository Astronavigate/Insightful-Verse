# About
insightful.about.title=Acerca de Capítulo de Sabiduría
insightful.about.header=Capítulo de Sabiduría — Plataforma de compartición de conocimiento y aprendizaje
insightful.about.aboutUs=Sobre nosotros
insightful.about.description=Capítulo de Sabiduría es una plataforma moderna para compartir conocimiento y aprendizaje, donde los usuarios pueden subir recursos educativos y compartirlos con otros tras su revisión. La plataforma ayuda a individuos y comunidades a recopilar, organizar y explorar contenido de alta calidad, incluyendo documentos, código, medios y notas, de manera estructurada y sostenible.
insightful.about.mission=Nuestra misión
insightful.about.missionDesc=Nuestra misión es construir un entorno abierto y confiable para el intercambio de conocimiento y convertir el contenido de calidad aportado por los usuarios en una base de conocimiento pública en constante crecimiento para el aprendizaje y referencia.
insightful.about.features=Nuestras funciones
insightful.about.feature1=Sistema de carga y revisión de recursos de usuarios
insightful.about.feature2=Plataforma para compartir contenido de alta calidad
insightful.about.feature3=Soporte para recursos de aprendizaje en múltiples formatos (documentos, código, medios, notas)
insightful.about.feature4=Organización estructurada del conocimiento
insightful.about.feature5=Búsqueda, lectura y resumen asistidos por IA
insightful.about.impact=Nuestro impacto
insightful.about.impactDesc=Capítulo de Sabiduría permite a los usuarios compartir materiales educativos valiosos con otros y beneficiarse de recursos comunitarios de alta calidad. Mediante la revisión de contenido y la organización estructurada, la plataforma ayuda a los estudiantes a acceder al conocimiento confiable de manera más eficiente y promueve un ecosistema positivo de intercambio de conocimiento.
insightful.about.future=Perspectivas futuras
insightful.about.futureDesc=En el futuro, Capítulo de Sabiduría continuará mejorando su sistema de revisión de contenido y sus capacidades de organización del conocimiento, e introducirá más herramientas impulsadas por IA para ayudar a los usuarios a descubrir, comprender y reutilizar el conocimiento compartido de manera más eficaz.

