<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insightful Verse - Core Shell</title>

    <th:block th:replace="~{common/sub/iviep/iviep-common.html}"></th:block>
    <script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>

    <style>
        :root {
            --bg-main: #0a0a0a;
            --bg-panel: #121212;
            --accent: #0071C5;
            --text-primary: #e6eef8;
            --text-secondary: #888;
            --border-color: #262626;
        }

        body {
            background: var(--bg-main);
            color: var(--text-primary);
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        #terminal, .input-zone {
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* 终端显示区 */
        #terminal {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--border-color) transparent;
        }

        .entry {
            margin-bottom: 2rem;
            border-left: 2px solid var(--border-color);
            padding-left: 1.5rem;
            transition: border-color 0.3s;
        }
        .entry:hover { border-color: var(--accent); }

        .tag {
            font-size: 0.7rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .file-badge {
            display: inline-block;
            background: rgba(0, 113, 197, 0.1);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 2px 8px;
            font-size: 0.75rem;
            margin-bottom: 0.5rem;
        }

        .out { line-height: 1.7; font-size: 0.95rem; }
        .out pre { background: #000; border: 1px solid var(--border-color); padding: 1rem; margin: 1rem 0; }
        .out code { color: #8cb4ff; }

        /* 输入区 */
        .input-zone {
            background: var(--bg-panel);
            border-top: 1px solid var(--border-color);
            padding: 1.5rem 2rem;
        }

        #meta-info {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            background: #000;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 1rem;
            outline: none;
            resize: none;
            font-family: inherit;
            border-radius: 4px;
        }
        textarea:focus { border-color: var(--accent); }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 1rem;
        }

        .btn-custom {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 0.8rem;
            padding: 0.5rem 1rem;
            text-transform: uppercase;
            transition: 0.2s;
        }
        .btn-custom:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
        .btn-primary-custom { background: var(--accent); color: #fff; border-color: var(--accent); }
    </style>
</head>
<body>
<th:block th:replace="~{common/sub/iviep/iviep-header :: header}"></th:block>

<div id="terminal"></div>

<div class="input-zone">
    <div id="meta-info">SYSTEM_READY // IDLE</div>
    <textarea id="cmd" rows="3" placeholder="Input instructions or logic queries..."></textarea>

    <div class="controls">
        <input type="file" id="file-in" hidden accept=".txt,.md,.csv,.docx">
        <button class="btn btn-custom" onclick="document.getElementById('file-in').click()">Mount_File</button>
        <button class="btn btn-custom btn-primary-custom" onclick="run()">Execute_Logic</button>
        <button class="btn btn-custom text-danger" id="interruptBtn">Interrupt</button>
        <button class="btn btn-custom" id="exportBtn">Export_Log</button>
    </div>
</div>

<script>
    let rawDoc = "", fName = "";
    let currentReader = null, currentSessionId = null;
    let mdBuffer = '';

    // --- 文件读取逻辑 (修复无法重复上传问题) ---
    document.getElementById('file-in').onchange = async (e) => {
        const f = e.target.files[0];
        if(!f) return;

        fName = f.name;
        document.getElementById('meta-info').innerText = `MOUNTED // ${fName.toUpperCase()}`;

        try {
            if(fName.endsWith('.docx')){
                const b = await f.arrayBuffer();
                const r = await mammoth.extractRawText({arrayBuffer: b});
                rawDoc = r.value;
            } else {
                rawDoc = await f.text();
            }
        } catch (err) {
            console.error("File Read Error:", err);
            document.getElementById('meta-info').innerText = "ERROR // FILE_READ_FAILED";
        }

        // 重要：清空 value，确保下一次选择同一个文件时依然能触发 onchange
        e.target.value = '';
    };

    // --- Markdown 解析与渲染逻辑 ---
    function renderOutput(node, content) {
        // 1. 标准化 HTML 链接
        let processed = content.replace(/<a\s+href\s*=\s*["']?([^"'\s>]+)["']?\s*>([\s\S]*?)<\/a>/gi, (match, href, label) => {
            return `[${label.trim() || href}](${href})`;
        });

        // 2. 链接化普通 URL
        const urlRegex = /(https?:\/\/[^\s`<>()\]\[]+)/g;
        processed = processed.replace(urlRegex, (url) => {
            // 简单判断是否已经在 Markdown 链接格式内
            return `[${url}](${url})`;
        });

        // 3. Marked 解析与 Sanitization
        const rawHtml = marked.parse(processed, { breaks: true, gfm: true });
        node.innerHTML = DOMPurify.sanitize(rawHtml);
    }

    // --- 执行逻辑 ---
    async function run(){
        const input = document.getElementById('cmd');
        const term = document.getElementById('terminal');
        const userPrompt = input.value.trim();

        if(!userPrompt && !rawDoc) return;

        // UI: User Entry
        const userEntry = document.createElement('div');
        userEntry.className = 'entry';
        userEntry.innerHTML = `
            <div class="tag">Source_Origin</div>
            ${fName ? `<span class="file-badge">${fName}</span><br>` : ""}
            <div class="out">${escapeHtml(userPrompt || "Analyzing mounted document...")}</div>
        `;
        term.appendChild(userEntry);

        // UI: AI Entry
        const aiEntry = document.createElement('div');
        aiEntry.className = 'entry';
        aiEntry.innerHTML = `<div class="tag">Logic_Output</div><div class="out"></div>`;
        term.appendChild(aiEntry);
        const outputNode = aiEntry.querySelector('.out');

        const fullContent = rawDoc ? `Context: ${rawDoc}\n\nQuery: ${userPrompt}` : userPrompt;

        // Reset state
        input.value = "";
        rawDoc = "";
        fName = "";
        mdBuffer = '';
        document.getElementById('meta-info').innerText = "PROCESSING...";

        try {
            const response = await fetch('/api/AiBot/stream', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({query: fullContent, table_name: ""})
            });

            if(!response.ok) throw new Error(`HTTP_${response.status}`);
            const reader = response.body.getReader();
            currentReader = reader;

            let buffer = "";
            while(true){
                const {done, value} = await reader.read();
                if(done) break;

                buffer += new TextDecoder().decode(value, {stream:true});
                let parts = buffer.split('\n\n');
                buffer = parts.pop();

                for(const part of parts){
                    if(part.startsWith('data:')){
                        const payload = part.substring(5).trim();
                        if(payload === '[STOP]') break;

                        try {
                            const obj = JSON.parse(payload);
                            if(obj.session_id) currentSessionId = obj.session_id;
                            if(obj.type === 'token') {
                                mdBuffer += obj.content;
                                renderOutput(outputNode, mdBuffer);
                            }
                        } catch(e) {
                            mdBuffer += payload;
                            renderOutput(outputNode, mdBuffer);
                        }
                        term.scrollTop = term.scrollHeight;
                    }
                }
            }
        } catch (err) {
            outputNode.innerHTML += `<div class="text-danger mt-2">[FATAL_ERROR] ${err.message}</div>`;
        } finally {
            document.getElementById('meta-info').innerText = "SYSTEM_READY // IDLE";
            currentReader = null;
        }
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // 中断与导出逻辑
    document.getElementById('interruptBtn').onclick = async ()=> {
        if(!currentSessionId) return;
        fetch(`/api/AiBot/interrupt/${currentSessionId}`, { method: 'POST' });
        if(currentReader) currentReader.cancel();
        document.getElementById('meta-info').innerText = 'INTERRUPTED';
    };

    document.getElementById('exportBtn').onclick = () => {
        const content = document.getElementById('terminal').innerText;
        const blob = new Blob([content], {type:'text/plain'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `session_${Date.now()}.txt`;
        a.click();
    };
</script>
</body>
</html>
