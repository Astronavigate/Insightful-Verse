<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Insightful PowerPoint Reader ' + ${file != null ? ' - ' + file.fileName : 'None'}">Power Point Reader</title>

    <link rel="stylesheet" href="/lib/PPTXjs-1.21.1/css/pptxjs.css">
    <link rel="stylesheet" href="/lib/novus-nvd3-447cce8/build/nv.d3.min.css">

    <style>
        :root {
            --header-h: 72px;
            --glass-bg: rgba(18, 18, 18, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary-text: #e6eef8;
            --secondary-text: #adb5bd;
            --background-dark: #050505;
            --ice-white: #ffffff;
            --silver-mercury: rgba(255, 255, 255, 0.35);
            --radius-btn: 8px;
            --mono-font: 'JetBrains Mono', 'Fira Code', monospace;
        }

        html, body {
            height: 100%;
            margin: 0;
            background: var(--background-dark) !important;
            color: var(--primary-text);
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }

        .ppt-wrap {
            height: calc(100vh - var(--header-h));
            display: flex;
            flex-direction: column;
            padding: 24px;
            box-sizing: border-box;
            align-items: center;
        }

        #pptContainer {
            width: 100%;
            max-width: 1400px;
            flex: 1;
            border-radius: 12px;
            background: var(--glass-bg);
            backdrop-filter: blur(50px) saturate(120%);
            -webkit-backdrop-filter: blur(50px) saturate(120%);

            /* 动态高光边框核心实现 */
            border: 1px solid var(--glass-border);
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
            box-shadow:
                    0 0 0 1px rgba(255, 255, 255, 0.1),
                    0 30px 80px rgba(0, 0, 0, 0.8);

            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Controls */
        #controls {
            display: flex;
            align-items: center;
            height: 60px;
            padding: 0 24px;
            background: rgba(255, 255, 255, 0.02);
            z-index: 100;
        }

        .simplified-controls {
            display: flex;
            align-items: center;
            width: 100%;
            position: relative;
        }

        .controls-left { display: flex; gap: 12px; align-items: center; flex: 1; }
        .controls-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
        }
        .controls-right { display: flex; gap: 12px; align-items: center; flex: 1; justify-content: flex-end; }

        /* 进度条位置：置于 Control 和 Viewer 之间 */
        .progress-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            height: 2px; /* 更细，更具锋芒 */
            z-index: 101;
        }
        #loadingProgress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, transparent, var(--ice-white));
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.7);
            transition: width 0.15s ease-out;
        }

        /* 按钮与文本指标 */
        .control-btn {
            height: 34px;
            padding: 0 14px;
            border-radius: var(--radius-btn);
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.02);
            color: var(--ice-white);
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }
        .control-btn:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.4); }

        .control-text { font-size: 0.85rem; color: var(--secondary-text); letter-spacing: 0.5px; }
        #charCount { color: var(--ice-white); font-weight: 500; }

        /* Viewer */
        #viewerWrapper { flex: 1; position: relative; overflow: hidden; background: rgba(0,0,0,0.1); }

        #pptxViewer {
            height: 100%;
            padding: 40px 15px;
            overflow-y: auto;
            display: flex;
            /*justify-content: center;*/
        }

        .pptxjs { padding: 0 !important; }
        .pptxjs-slide { margin: 0 auto; }

        /* 可选滚动条样式 */
        #pptxViewer::-webkit-scrollbar { width: 6px; height: 6px; }
        #pptxViewer::-webkit-scrollbar-thumb {
            background: var(--silver-mercury);
            border-radius: 10px;
        }
        #pptxViewer::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.5); }

        /* Loading */
        @font-face {
            font-family: 'Segoe Boot Semilight';
            src: url('/lib/fonts/segoe_slboot.ttf') format('truetype');
        }

        /* 加载动画覆盖层 */
        #bootOverlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--background-dark);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .boot-spinner {
            font-family: 'Segoe Boot Semilight';
            font-size: 42px;
            color: var(--ice-white);
            line-height: 1;
        }
    </style>
    <th:block th:replace="~{common/sub/iviep/iviep-common.html}"></th:block>
    <th:block th:replace="~{common/sub/iviep/lib/view-history :: viewhist}"></th:block>
</head>
<body style="background-color: #0a0a0a;">
<th:block th:replace="~{common/sub/iviep/iviep-header :: header}"></th:block>

<div class="ppt-wrap">
    <div id="pptContainer">
        <div id="bootOverlay">
            <div class="boot-spinner" id="bootAnim"></div>
        </div>
        <div id="controls">
            <div class="controls-left">
                <button class="control-btn" id="fullScreenBtn">Full Screen</button>
            </div>
            <div class="controls-right">
                <button class="control-btn" id="downloadBtn">Download</button>
            </div>
        </div>
        <div class="progress-container">
            <div id="loadingProgress"></div>
        </div>
        <div id="viewerWrapper">
            <div id="pptxViewer"></div>
        </div>
    </div>
</div>

<script src="/lib/jquery-3.7.1/dist/jquery.min.js"></script>
<script src="/lib/jszip-2.6.1/dist/jszip.min.js"></script>
<script src="/lib/PPTXjs-1.21.1/js/filereader.js"></script>
<script src="/lib/d3-3.5.17/d3.min.js"></script>
<script src="/lib/d3-3.5.17/d3.min.js"></script>
<script src="/lib/novus-nvd3-447cce8/build/nv.d3.min.js"></script>
<script src="/lib/PPTXjs-1.21.1/js/pptxjs.js"></script>
<script src="/lib/PPTXjs-1.21.1/js/divs2slides.js"></script>

<script>
    const FILE_PATH = "[[${file != null ? file.filePath : ''}]]";
    const FILE_NAME = "[[${file != null ? file.fileName : ''}]]";
    const FILE_TYPE = "[[${file != null ? file.type : ''}]]";

    // --- 加载帧动画 (E052-E0CB) ---
    const startAnim = () => {
        const el = document.getElementById('bootAnim');

        let curr = 0xE052;
        return setInterval(() => {
            el.innerText = String.fromCharCode(curr);
            if (++curr > 0xE0CB) curr = 0xE052;
        }, 40);
    };

    $(function() {
        const animId = startAnim();
        this.progressBar = document.getElementById('loadingProgress');
        this.container = document.getElementById('pptContainer');
        this.viewer = document.getElementById('pptxViewer');

        // 初始化 PPTXjs
        $("#pptxViewer").pptxToHtml({
            pptxFileUrl: FILE_PATH,
            slideMode: false,
            keyBoardShortCut: true,
            mediaProcess: true,
            slidesScale: "100%",
        });

        this.progressBar.style.width = "0%"

        this.viewer.addEventListener('scroll', () => {
            const scrolled = this.viewer.scrollTop;
            const total = this.viewer.scrollHeight - this.viewer.clientHeight;
            const progress = total <= 0 ? 0 : scrolled / total;

            this.progressBar.style.width = (progress * 100) + "%";

            // 动态调整边框亮度 (0.08 到 0.25 之间的变化)
            const glowIntensity = 0.08 + (progress * 0.12);
            const shadowIntensity = 0.8 + (progress * 0.1);
            this.container.style.borderColor = `rgba(255, 255, 255, ${glowIntensity})`;
            this.container.style.boxShadow = `0 0 0 1px rgba(255, 255, 255, ${glowIntensity / 2}), 0 40px 100px rgba(0,0,0,${shadowIntensity})`;
        });

        document.getElementById('downloadBtn').addEventListener('click', () => {
            const url = /*[[${file != null ? file.filePath : ''}]]*/ '';
            if (url) { const a = document.createElement('a'); a.href = url; a.download = /*[[${file != null ? file.fileName : ''}]]*/ ''; a.click(); }
        });

        // 下载按钮
        $("#downloadBtn").on("click", function() {
            const fileName = FILE_NAME + "." + FILE_TYPE
            const a = document.createElement("a");
            a.href = FILE_PATH;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });

        // 全屏按钮
        $("#fullScreenBtn").on("click", function() {
            const elem = document.getElementById("pptxViewer");
            if (elem.requestFullscreen) elem.requestFullscreen();
            else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
            else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
        });

        clearInterval(animId);
        // 隐藏加载覆盖层 (使用渐隐效果更符合你的冷峻美学)
        $("#bootOverlay").fadeOut(600, function() {
            $(this).remove(); // 彻底从 DOM 中移除
        });
    });
</script>

</body>
</html>
