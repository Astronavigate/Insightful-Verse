# ==================== About ====================
insightful.about.title=知恵の章について
insightful.about.header=知恵の章 — 知識共有と学習のプラットフォーム
insightful.about.aboutUs=私たちについて
insightful.about.description=知恵の章は、ユーザーが学習リソースをアップロードし、レビュー後に他のユーザーと共有できる、現代的な知識共有・学習プラットフォームです。このプラットフォームは、個人やコミュニティが文書、コード、メディア、ノートなどの高品質な知識コンテンツを構造化された持続可能な方法で収集、整理、探索できるように設計されています。
insightful.about.mission=私たちの使命
insightful.about.missionDesc=私たちの使命は、オープンで信頼できる知識共有環境を構築し、ユーザーが提供する高品質なコンテンツを学習や参照のための継続的に成長する公共の知識ベースに変換することです。
insightful.about.features=主な機能
insightful.about.feature1=ユーザーリソースのアップロードとレビューシステム
insightful.about.feature2=高品質コンテンツ共有プラットフォーム
insightful.about.feature3=マルチフォーマット学習リソース（文書、コード、メディア、ノート）
insightful.about.feature4=構造化された知識の整理
insightful.about.feature5=AI支援による検索・読解・要約
insightful.about.impact=私たちの影響
insightful.about.impactDesc=知恵の章は、ユーザーが価値のある学習資料を他の人と共有し、高品質なコミュニティリソースから利益を得られるようにします。コンテンツレビューと構造化された整理を通じて、学習者は信頼できる知識により効率的にアクセスでき、ポジティブな知識共有のエコシステムを促進します。
insightful.about.future=今後の展望
insightful.about.futureDesc=将来的に、知恵の章はコンテンツレビューシステムと知識整理機能をさらに改善し、AI駆動のツールを追加して、ユーザーが共有された知識をより効率的に発見、理解、再利用できるよう支援していきます。


