# About
insightful.about.title=Über WeisheitsKapitel
insightful.about.header=WeisheitsKapitel — Plattform für Wissensaustausch und Lernen
insightful.about.aboutUs=Über uns
insightful.about.description=WeisheitsKapitel ist eine moderne Plattform für Wissensaustausch und Lernen, auf der Benutzer Lernressourcen hochladen und nach Prüfung mit anderen teilen können. Die Plattform hilft Einzelpersonen und Gemeinschaften, hochwertige Wissensinhalte, einschließlich Dokumente, Code, Medien und Notizen, strukturiert und nachhaltig zu sammeln, zu organisieren und zu erkunden.
insightful.about.mission=Unsere Mission
insightful.about.missionDesc=Unsere Mission ist es, eine offene und verlässliche Umgebung für Wissensaustausch zu schaffen und qualitativ hochwertige Inhalte der Benutzer in eine kontinuierlich wachsende öffentliche Wissensbasis für Lernen und Referenz umzuwandeln.
insightful.about.features=Unsere Funktionen
insightful.about.feature1=Benutzerressourcen-Upload- und Prüfungssystem
insightful.about.feature2=Plattform für das Teilen von hochwertigen Inhalten
insightful.about.feature3=Unterstützung mehrerer Lernressourcen-Formate (Dokumente, Code, Medien, Notizen)
insightful.about.feature4=Strukturierte Wissensorganisation
insightful.about.feature5=KI-gestützte Suche, Lesen und Zusammenfassung
insightful.about.impact=Unsere Wirkung
insightful.about.impactDesc=WeisheitsKapitel ermöglicht es Benutzern, wertvolle Lernmaterialien mit anderen zu teilen und von hochwertigen Community-Ressourcen zu profitieren. Durch Inhaltsprüfung und strukturierte Organisation hilft die Plattform Lernenden, effizienter auf verlässliches Wissen zuzugreifen, und fördert ein positives Wissensaustausch-Ökosystem.
insightful.about.future=Zukunftsausblick
insightful.about.futureDesc=In Zukunft wird WeisheitsKapitel sein Inhaltsprüfungssystem und die Fähigkeiten zur Wissensorganisation weiter verbessern und mehr KI-gestützte Tools einführen, die den Nutzern helfen, geteiltes Wissen effizienter zu entdecken, zu verstehen und wiederzuverwenden.

