<style>
@font-face {
font-family: 'Segoe Boot Semilight';
src: url('/lib/fonts/segoe_slboot.ttf') format('truetype');
}

/* 加载动画覆盖层 */
#bootOverlay {
position: absolute;
top: 0;
left: 0;
right: 0;
bottom: 0;
background: var(--background-dark);
z-index: 1000;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
}

.boot-spinner {
font-family: 'Segoe Boot Semilight';
font-size: 42px;
color: var(--ice-white);
line-height: 1;
}
</style>


<div class="reader-wrap">
    <div id="textContainer">
        <!-- 加载动画 -->
        <div id="bootOverlay">
            <div class="boot-spinner" id="bootAnim"></div>
            <div class="control-text" style="margin-top:20px; opacity:0.4;">BUFFERING_PPT_STREAM...</div>
        </div>

    </div>
</div>


<script>
// --- 加载帧动画 (E052-E0CB) ---
const startAnim = () => {
const el = document.getElementById('bootAnim');

let curr = 0xE052;
return setInterval(() => {
el.innerText = String.fromCharCode(curr);
if (++curr > 0xE0CB) curr = 0xE052;
}, 40);
};
const animId = startAnim();

$(function() {
    // 初始化 PPTXjs
    $("#pptx-viewer").pptxToHtml({
        pptxFileUrl: FILE_PATH,
        slideMode: false,
        keyBoardShortCut: true,
        mediaProcess: true,
        slidesScale: "100%"
    });

    // 下载按钮
    $("#downloadBtn").on("click", function() {
        const fileName = FILE_PATH.split("/").pop().split("?")[0];
        const a = document.createElement("a");
        a.href = FILE_PATH;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    });

    // 全屏按钮
    $("#fullScreenBtn").on("click", function() {
        const elem = document.getElementById("pptx-viewer");
        if (elem.requestFullscreen) elem.requestFullscreen();
        else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
        else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
    });
});
</script>
