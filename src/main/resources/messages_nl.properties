# over
insightful.about.title=Over Hoofdstuk der Wijsheid
insightful.about.header=Hoofdstuk der Wijsheid — Een platform voor kennisdeling en leren
insightful.about.aboutUs=Over ons
insightful.about.description=Hoofdstuk der Wijsheid is een modern platform voor kennisdeling en leren, waar gebruikers leermaterialen kunnen uploaden en na beoordeling met anderen kunnen delen. Het platform is ontworpen om individuen en gemeenschappen te helpen hoogwaardige kennisinhoud, waaronder documenten, code, media en notities, op een gestructureerde en duurzame manier te verzamelen, organiseren en verkennen.
insightful.about.mission=Onze missie
insightful.about.missionDesc=Onze missie is het bouwen van een open en betrouwbaar kennisdeelplatform, waarbij hoogwaardige door gebruikers bijgedragen inhoud wordt omgezet in een continu groeiende openbare kennisbasis voor leren en referentie.
insightful.about.features=Onze functies
insightful.about.feature1=Upload- en beoordelingssysteem voor gebruikersbronnen
insightful.about.feature2=Platform voor het delen van hoogwaardige inhoud
insightful.about.feature3=Ondersteuning voor leermaterialen in meerdere formaten (documenten, code, media, notities)
insightful.about.feature4=Gestructureerde kennisorganisatie
insightful.about.feature5=AI-ondersteunde zoek-, lees- en samenvattingsfuncties
insightful.about.impact=Onze impact
insightful.about.impactDesc=Hoofdstuk der Wijsheid stelt gebruikers in staat waardevolle leermaterialen te delen met anderen en te profiteren van hoogwaardige communitybronnen. Door inhoudsbeoordeling en gestructureerde organisatie helpt het platform leerlingen efficiënter toegang te krijgen tot betrouwbare kennis en bevordert het een positief ecosysteem voor kennisdeling.
insightful.about.future=Toekomstperspectief
insightful.about.futureDesc=In de toekomst zal Hoofdstuk der Wijsheid blijven werken aan verbeteringen van het inhoudsbeoordelingssysteem en de mogelijkheden voor kennisorganisatie, en zal het meer AI-gestuurde tools introduceren om gebruikers te helpen gedeelde kennis effectiever te ontdekken, begrijpen en hergebruiken.

