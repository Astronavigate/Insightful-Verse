# 소개
insightful.about.title=지혜의 장 소개
insightful.about.header=지혜의 장 — 지식 공유 및 학습 플랫폼
insightful.about.aboutUs=회사 소개
insightful.about.description=지혜의 장은 사용자가 학습 자료를 업로드하고 검토 후 다른 사용자와 공유할 수 있는 현대적인 지식 공유 및 학습 플랫폼입니다. 이 플랫폼은 개인과 커뮤니티가 문서, 코드, 미디어, 노트 등 고품질 지식 콘텐츠를 구조적이고 지속 가능한 방식으로 수집, 조직 및 탐색할 수 있도록 설계되었습니다.
insightful.about.mission=우리의 미션
insightful.about.missionDesc=우리의 미션은 개방적이고 신뢰할 수 있는 지식 공유 환경을 구축하여, 사용자가 제공하는 고품질 콘텐츠를 학습 및 참조를 위한 지속적으로 성장하는 공공 지식 기반으로 전환하는 것입니다.
insightful.about.features=주요 기능
insightful.about.feature1=사용자 리소스 업로드 및 검토 시스템
insightful.about.feature2=고품질 콘텐츠 공유 플랫폼
insightful.about.feature3=멀티 포맷 학습 자료 지원 (문서, 코드, 미디어, 노트)
insightful.about.feature4=구조화된 지식 조직
insightful.about.feature5=AI 지원 검색, 읽기 및 요약
insightful.about.impact=우리의 영향
insightful.about.impactDesc=지혜의 장은 사용자가 가치 있는 학습 자료를 다른 사람과 공유하고 고품질 커뮤니티 리소스의 혜택을 받을 수 있도록 지원합니다. 콘텐츠 검토와 구조화된 조직을 통해 학습자는 신뢰할 수 있는 지식에 보다 효율적으로 접근할 수 있으며, 긍정적인 지식 공유 생태계를 촉진합니다.
insightful.about.future=미래 전망
insightful.about.futureDesc=앞으로 지혜의 장은 콘텐츠 검토 시스템과 지식 조직 기능을 지속적으로 개선하고, AI 기반 도구를 추가하여 사용자가 공유된 지식을 보다 효율적으로 발견, 이해 및 재활용할 수 있도록 도울 것입니다.

