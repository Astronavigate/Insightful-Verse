# ==================== About ====================
insightful.about.title=Om Visdomskapittelet
insightful.about.header=Visdomskapittelet — En plattform for kunnskapsdeling og læring
insightful.about.aboutUs=Om oss
insightful.about.description=Visdomskapittelet er en moderne plattform for kunnskapsdeling og læring hvor brukere kan laste opp læringsressurser og dele dem med andre etter gjennomgang. Plattformen er designet for å hjelpe enkeltpersoner og samfunn med å samle, organisere og utforske høykvalitets kunnskapsinnhold, inkludert dokumenter, kode, medier og notater, på en strukturert og bærekraftig måte.
insightful.about.mission=Vår misjon
insightful.about.missionDesc=Vår misjon er å bygge et åpent og pålitelig miljø for kunnskapsdeling, som gjør høy-kvalitets innhold fra brukere til en kontinuerlig voksende offentlig kunnskapsbase for læring og referanse.
insightful.about.features=Våre funksjoner
insightful.about.feature1=Brukeropplasting og gjennomgangssystem
insightful.about.feature2=Plattform for deling av høykvalitetsinnhold
insightful.about.feature3=Støtte for læringsressurser i flere formater (dokumenter, kode, medier, notater)
insightful.about.feature4=Strukturert kunnskapsorganisering
insightful.about.feature5=AI-assistert søk, lesing og oppsummering
insightful.about.impact=Vår påvirkning
insightful.about.impactDesc=Visdomskapittelet gjør det mulig for brukere å dele verdifulle læringsmaterialer med andre og dra nytte av høykvalitets fellesskapsressurser. Gjennom innholdsrevisjon og strukturert organisering hjelper plattformen lærende med å få mer effektiv tilgang til pålitelig kunnskap og fremmer et positivt økosystem for kunnskapsdeling.
insightful.about.future=Fremtidsutsikter
insightful.about.futureDesc=I fremtiden vil Visdomskapittelet fortsette å forbedre sitt innholdsrevisjonssystem og kunnskapsorganisasjonskapasitet, og introdusere flere AI-drevne verktøy for å hjelpe brukere med å oppdage, forstå og gjenbruke delt kunnskap mer effektivt.

