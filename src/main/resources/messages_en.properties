# ==================== 关于（About） ====================
insightful.about.title=About Insightful Verse
insightful.about.header=Insightful Verse — A Knowledge Sharing & Learning Platform
insightful.about.aboutUs=About Us
insightful.about.description=Insightful Verse is a modern knowledge sharing and learning platform where users can upload learning resources and share them with others after review. The platform is designed to help individuals and communities collect, organize, and explore high-quality knowledge content, including documents, code, media, and notes, in a structured and sustainable way.
insightful.about.mission=Our Mission
insightful.about.missionDesc=Our mission is to build an open and reliable knowledge sharing environment, turning high-quality user-contributed content into a continuously growing public knowledge base for learning and reference.
insightful.about.features=Our Features
insightful.about.feature1=User Resource Upload & Review System
insightful.about.feature2=High-quality Content Sharing Platform
insightful.about.feature3=Multi-format Learning Resources (Docs, Code, Media, Notes)
insightful.about.feature4=Structured Knowledge Organization
insightful.about.feature5=AI-assisted Search, Reading and Summarization
insightful.about.impact=Our Impact
insightful.about.impactDesc=Insightful Verse enables users to share valuable learning materials with others and benefit from high-quality community resources. Through content review and structured organization, the platform helps learners access reliable knowledge more efficiently and promotes a positive knowledge-sharing ecosystem.
insightful.about.future=Future Outlook
insightful.about.futureDesc=In the future, Insightful Verse will continue to improve its content review system and knowledge organization capabilities, and introduce more AI-powered tools to help users discover, understand, and reuse shared knowledge more effectively.


