<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Error</title>

    <!-- 公共资源 -->
    <th:block th:replace="~{common/sub/iviep/iviep-common.html}"></th:block>

    <style>
        .error-header {
            color: #ff6b6b;
        }

        .error-header i {
            font-size: 2.8rem;
            line-height: 1;
        }

        .error-title {
            color: #2c3e50;
            margin: 0;
        }

        .error-message {
            color: #5a6c7d;
            font-size: 1.15rem;
            line-height: 1.7;
        }
    </style>
</head>

<body class="default">

<!-- Header -->
<th:block th:replace="~{common/sub/iviep/iviep-header :: header}"></th:block>

<!-- Error Container -->
<div
        class="my-5 liquid d-flex flex-column justify-content-center align-items-center"
        style="
        width: 56vw;
        max-width: 800px;
        margin: 0 auto;
        padding: 3rem;
        border-radius: 20px;
    "
>

    <!-- Icon + Title (single line) -->
    <div class="error-header d-flex align-items-center gap-3 mb-4">
        <i class="bi bi-exclamation-circle"></i>
        <h2 class="error-title">Something Went Wrong</h2>
    </div>

    <!-- Error Message -->
    <div class="error-message text-center mb-4">
        <p th:text="${errorMessage}" class="mb-0">
            We encountered an error while processing your request.
        </p>
    </div>

    <!-- Actions -->
    <div class="d-flex gap-3 mb-3">
        <a
                href="/InsightfulVerse/"
                class="btn btn-primary d-flex align-items-center gap-2"
        >
            <i class="bi bi-house-door"></i>
            <span>Back to Home</span>
        </a>

        <button
                type="button"
                onclick="history.back()"
                class="btn btn-outline-primary d-flex align-items-center gap-2"
        >
            <i class="bi bi-arrow-left"></i>
            <span>Go Back</span>
        </button>
    </div>

    <!-- Meta Info -->
    <div class="text-muted small mt-4 pt-3 border-top text-center">
        <i class="bi bi-info-circle me-1"></i>

        <span th:if="${timestamp}">
            Error occurred at:
            <span th:text="${timestamp}"></span>
        </span>

        <span th:unless="${timestamp}">
            Please try again later.
        </span>
    </div>

</div>

<div class="blank"></div>

<!-- Footer -->
<th:block th:replace="~{common/sub/iviep/iviep-footer :: footer}"></th:block>

</body>
</html>
