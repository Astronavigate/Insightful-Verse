# ==================== About ====================
insightful.about.title=О Глава Мудрости
insightful.about.header=Глава Мудрости — Платформа для обмена знаниями и обучения
insightful.about.aboutUs=О нас
insightful.about.description=Глава Мудрости — это современная платформа для обмена знаниями и обучения, где пользователи могут загружать учебные материалы и делиться ими с другими после проверки. Платформа предназначена для того, чтобы помочь отдельным пользователям и сообществам собирать, организовывать и изучать качественный контент, включая документы, код, медиа и заметки, в структурированном и устойчивом виде.
insightful.about.mission=Наша миссия
insightful.about.missionDesc=Наша миссия — создать открытое и надежное пространство для обмена знаниями, превращая качественный контент, предоставленный пользователями, в постоянно растущую публичную базу знаний для обучения и справки.
insightful.about.features=Наши возможности
insightful.about.feature1=Система загрузки и проверки пользовательских ресурсов
insightful.about.feature2=Платформа для обмена качественным контентом
insightful.about.feature3=Многоформатные учебные ресурсы (документы, код, медиа, заметки)
insightful.about.feature4=Структурированная организация знаний
insightful.about.feature5=Поиск, чтение и резюмирование с поддержкой ИИ
insightful.about.impact=Наше влияние
insightful.about.impactDesc=Глава Мудрости позволяет пользователям делиться ценными учебными материалами с другими и получать пользу от качественных ресурсов сообщества. Благодаря проверке контента и структурированной организации платформа помогает учащимся более эффективно получать доступ к надежным знаниям и способствует позитивной экосистеме обмена знаниями.
insightful.about.future=Перспективы
insightful.about.futureDesc=В будущем Глава Мудрости продолжит совершенствовать систему проверки контента и возможности организации знаний, а также внедрять больше инструментов на основе ИИ, чтобы помогать пользователям более эффективно обнаруживать, понимать и повторно использовать совместно используемые знания.

