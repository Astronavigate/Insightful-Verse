<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Insightful Verse - View History</title>
    <th:block th:replace="~{common/sub/iviep/iviep-common.html}"></th:block>

    <style>
        .pager-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 10px;
        }

        .pager-container .page-info {
            font-size: 14px;
            color: #777777;
        }

        .pager-container .pager-body {
            margin-top: 8px;
        }

        .pager-container .pager-body .page-link {
            cursor: pointer;
        }
    </style>
</head>
<body class="default">
<th:block th:replace="~{common/sub/iviep/iviep-header :: header}"></th:block>

<div class="contain">
    <table class="table table-striped table-hover liquid" id="viewListPlace">
        <tr>
            <td th:text="#{insightful.view.file}">File</td>
            <td th:text="#{insightful.view.count}">View Count</td>
            <td th:text="#{insightful.view.first}">First View Time</td>
            <td th:text="#{insightful.view.last}">Last Viewing Time</td>
        </tr>

        <tr th:if="${#lists.isEmpty(viewRecordList)}">
            <td th:text="#{insightful.view.none}">None</td>
            <td th:text="#{insightful.view.none}">None</td>
            <td th:text="#{insightful.view.none}">None</td>
            <td th:text="#{insightful.view.none}">None</td>
        </tr>

        <tr th:unless="${#lists.isEmpty(viewRecordList)}" th:each="record : ${viewRecordList}">
            <td>
                <a th:href="@{/InsightfulVerse/File(fileId=${record.file.fileId})}"
                   style="text-decoration: none; color: black;"
                   th:text="${record.file.fileName}"
                   th:title="${record.file.remarks}"></a>
            </td>
            <td th:text="${record.viewCount}"></td>
            <td th:text="${#dates.format(record.firstView, 'yyyy-MM-dd HH:mm:ss')}"></td>
            <td th:text="${#dates.format(record.viewDate, 'yyyy-MM-dd HH:mm:ss')}"></td>
        </tr>
    </table>
</div>

<div class="blank"></div>

<div class="pager-container">
    <div class="page-info">
        <span th:text="#{insightful.view.total(${totalItems})}">There are a total of 0 pieces of data</span>
    </div>
    <nav class="pager-body">
        <ul class="pagination justify-content-center">
            <th:block th:if="${totalPages <= 11}">
                <li class="page-item"
                    th:each="i : ${#numbers.sequence(1, totalPages)}"
                    th:classappend="${i == currentPage} ? ' active'">
                    <a class="page-link"
                       th:href="@{/InsightfulVerse/ViewHistory(page=${i}, max=${param.max})}"
                       th:text="${i}"></a>
                </li>
            </th:block>

            <th:block th:if="${totalPages > 11}">
                <th:block th:if="${currentPage <= 5}">
                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(1, 9)}"
                        th:classappend="${i == currentPage} ? ' active'">
                        <a class="page-link"
                           th:href="@{/InsightfulVerse/ViewHistory(page=${i}, max=${param.max})}"
                           th:text="${i}"></a>
                    </li>
                    <li class="page-item disabled"><span class="page-link">...</span></li>
                    <li class="page-item">
                        <a class="page-link"
                           th:href="@{/InsightfulVerse/ViewHistory(page=${totalPages}, max=${param.max})}"
                           th:text="${totalPages}"></a>
                    </li>
                </th:block>

                <th:block th:if="${currentPage >= totalPages - 4}">
                    <li class="page-item">
                        <a class="page-link"
                           th:href="@{/InsightfulVerse/ViewHistory(page=1, max=${param.max})}">1</a>
                    </li>
                    <li class="page-item disabled"><span class="page-link">...</span></li>
                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(totalPages - 8, totalPages)}"
                        th:classappend="${i == currentPage} ? ' active'">
                        <a class="page-link"
                           th:href="@{/InsightfulVerse/ViewHistory(page=${i}, max=${param.max})}"
                           th:text="${i}"></a>
                    </li>
                </th:block>

                <th:block th:if="${currentPage > 5 and currentPage < totalPages - 4}">
                    <li class="page-item">
                        <a class="page-link"
                           th:href="@{/InsightfulVerse/ViewHistory(page=1, max=${param.max})}">1</a>
                    </li>
                    <li class="page-item disabled"><span class="page-link">...</span></li>
                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(currentPage - 3, currentPage + 3)}"
                        th:classappend="${i == currentPage} ? ' active'">
                        <a class="page-link"
                           th:href="@{/InsightfulVerse/ViewHistory(page=${i}, max=${param.max})}"
                           th:text="${i}"></a>
                    </li>
                    <li class="page-item disabled"><span class="page-link">...</span></li>
                    <li class="page-item">
                        <a class="page-link"
                           th:href="@{/InsightfulVerse/ViewHistory(page=${totalPages}, max=${param.max})}"
                           th:text="${totalPages}"></a>
                    </li>
                </th:block>
            </th:block>
        </ul>
    </nav>

    <form action="/InsightfulVerse/ViewHistory" class="form-inline">
        <div class="input-group mb-3 liquid">
            <span class="input-group-text" style="border-top-left-radius: 24px; border-bottom-left-radius: 24px;" th:text="#{insightful.view.perpage}">Displayed per page:</span>
            <input type="number" class="form-control" min="1" max="200" name="max"
                   th:placeholder="#{insightful.view.placeholder}"
                   th:value="${param.max != null ? param.max : 15}">
            <button class="btn btn-outline-secondary" style="border-top-right-radius: 24px; border-bottom-right-radius: 24px; border-width: 0" type="submit" th:text="#{insightful.view.refresh}">Refresh</button>
        </div>
    </form>
</div>

<th:block th:replace="~{common/sub/iviep/iviep-footer :: footer}"></th:block>

</body>
</html>
