# ==================== About ====================
insightful.about.title=O Rozdziale Mądrości
insightful.about.header=Rozdział Mądrości — Platforma do dzielenia się wiedzą i nauki
insightful.about.aboutUs=O nas
insightful.about.description=Rozdział Mądrości to nowoczesna platforma do dzielenia się wiedzą i nauki, gdzie użytkownicy mogą przesyłać zasoby edukacyjne i dzielić się nimi z innymi po weryfikacji. Platforma została zaprojektowana, aby pomagać jednostkom i społecznościom w zbieraniu, organizowaniu i eksplorowaniu wysokiej jakości treści wiedzy, w tym dokumentów, kodu, mediów i notatek, w sposób uporządkowany i trwały.
insightful.about.mission=Nasza misja
insightful.about.missionDesc=Naszą misją jest stworzenie otwartego i wiarygodnego środowiska do dzielenia się wiedzą, przekształcając wysokiej jakości treści dostarczane przez użytkowników w stale rosnącą publiczną bazę wiedzy do nauki i odniesienia.
insightful.about.features=Nasze funkcje
insightful.about.feature1=System przesyłania i weryfikacji zasobów użytkownika
insightful.about.feature2=Platforma do udostępniania wysokiej jakości treści
insightful.about.feature3=Zasoby edukacyjne w wielu formatach (dokumenty, kod, media, notatki)
insightful.about.feature4=Strukturalna organizacja wiedzy
insightful.about.feature5=Wyszukiwanie, czytanie i streszczanie wspomagane przez AI
insightful.about.impact=Nasz wpływ
insightful.about.impactDesc=Rozdział Mądrości umożliwia użytkownikom dzielenie się wartościowymi materiałami edukacyjnymi z innymi i korzystanie z wysokiej jakości zasobów społeczności. Poprzez weryfikację treści i strukturalną organizację, platforma pomaga uczniom efektywniej uzyskiwać dostęp do wiarygodnej wiedzy i wspiera pozytywny ekosystem dzielenia się wiedzą.
insightful.about.future=Perspektywy przyszłości
insightful.about.futureDesc=W przyszłości Rozdział Mądrości będzie nadal ulepszać system weryfikacji treści i możliwości organizacji wiedzy, wprowadzając więcej narzędzi opartych na AI, aby pomóc użytkownikom skuteczniej odkrywać, rozumieć i ponownie wykorzystywać udostępnioną wiedzę.

