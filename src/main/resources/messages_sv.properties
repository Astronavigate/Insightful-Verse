# ==================== About ====================
insightful.about.title=Om Visdoms Kapitel
insightful.about.header=Visdoms Kapitel — En plattform för kunskapsdelning och lärande
insightful.about.aboutUs=Om oss
insightful.about.description=Visdoms Kapitel är en modern plattform för kunskapsdelning och lärande där användare kan ladda upp lärresurser och dela dem med andra efter granskning. Plattformen är utformad för att hjälpa individer och gemenskaper att samla, organisera och utforska högkvalitativt kunskapsinnehåll, inklusive dokument, kod, media och anteckningar, på ett strukturerat och hållbart sätt.
insightful.about.mission=Vårt uppdrag
insightful.about.missionDesc=Vårt uppdrag är att bygga en öppen och pålitlig miljö för kunskapsdelning, som förvandlar högkvalitativt användarskapat innehåll till en ständigt växande offentlig kunskapsbas för lärande och referens.
insightful.about.features=Våra funktioner
insightful.about.feature1=System för uppladdning och granskning av användarresurser
insightful.about.feature2=Plattform för delning av högkvalitativt innehåll
insightful.about.feature3=Stöder lärresurser i flera format (dokument, kod, media, anteckningar)
insightful.about.feature4=Strukturerad kunskapsorganisation
insightful.about.feature5=AI-assisterad sökning, läsning och sammanfattning
insightful.about.impact=Vår påverkan
insightful.about.impactDesc=Visdoms Kapitel gör det möjligt för användare att dela värdefulla lärmaterial med andra och dra nytta av högkvalitativa communityresurser. Genom innehållsgranskning och strukturerad organisering hjälper plattformen elever att få tillgång till pålitlig kunskap mer effektivt och främjar ett positivt ekosystem för kunskapsdelning.
insightful.about.future=Framtidsutsikter
insightful.about.futureDesc=I framtiden kommer Visdoms Kapitel att fortsätta förbättra sitt system för innehållsgranskning och sina kunskapsorganisationsfunktioner, samt införa fler AI-baserade verktyg för att hjälpa användare att upptäcka, förstå och återanvända delad kunskap mer effektivt.

