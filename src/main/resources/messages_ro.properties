# ==================== About ====================
insightful.about.title=Despre Capitolul Înțelepciunii
insightful.about.header=Capitolul Înțelepciunii — O platformă de partajare a cunoștințelor și învățare
insightful.about.aboutUs=Despre noi
insightful.about.description=Capitolul Înțelepciunii este o platformă modernă de partajare a cunoștințelor și învățare, unde utilizatorii pot încărca resurse de învățare și le pot împărtăși altora după revizuire. Platforma este concepută pentru a ajuta indivizii și comunitățile să colecteze, să organizeze și să exploreze conținut de cunoștințe de înaltă calitate, inclusiv documente, cod, media și notițe, într-un mod structurat și sustenabil.
insightful.about.mission=Misiunea noastră
insightful.about.missionDesc=Misiunea noastră este să construim un mediu deschis și de încredere pentru partajarea cunoștințelor, transformând conținutul de înaltă calitate furnizat de utilizatori într-o bază de cunoștințe publică, în continuă creștere, pentru învățare și referință.
insightful.about.features=Caracteristicile noastre
insightful.about.feature1=Sistem de încărcare și revizuire a resurselor utilizatorilor
insightful.about.feature2=Platformă pentru partajarea conținutului de înaltă calitate
insightful.about.feature3=Resurse de învățare în mai multe formate (documente, cod, media, notițe)
insightful.about.feature4=Organizarea structurată a cunoștințelor
insightful.about.feature5=Căutare, lectură și rezumare asistate de AI
insightful.about.impact=Impactul nostru
insightful.about.impactDesc=Capitolul Înțelepciunii permite utilizatorilor să împărtășească materiale de învățare valoroase cu alții și să beneficieze de resurse comunitare de înaltă calitate. Prin revizuirea conținutului și organizarea structurată, platforma ajută cursanții să acceseze cunoștințe de încredere mai eficient și promovează un ecosistem pozitiv de partajare a cunoștințelor.
insightful.about.future=Perspective viitoare
insightful.about.futureDesc=În viitor, Capitolul Înțelepciunii va continua să îmbunătățească sistemul său de revizuire a conținutului și capacitățile de organizare a cunoștințelor, introducând mai multe instrumente bazate pe AI pentru a ajuta utilizatorii să descopere, să înțeleagă și să reutilizeze cunoștințele partajate mai eficient.

