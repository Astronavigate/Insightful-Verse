# Tietoa (About)
insightful.about.title=Tietoa Viisauden Luku
insightful.about.header=Viisauden Luku — Tietojen jakamisen ja oppimisen alusta
insightful.about.aboutUs=Meistä
insightful.about.description=Viisauden Luku on moderni tietojen jakamisen ja oppimisen alusta, jossa käyttäjät voivat ladata oppimateriaaleja ja jakaa niitä muiden kanssa tarkastuksen jälkeen. Alusta auttaa yksilöitä ja yhteisöjä keräämään, järjestämään ja tutkimaan korkealaatuista tietosisältöä, mukaan lukien dokumentit, koodi, media ja muistiinpanot, rakenteellisesti ja kestävällä tavalla.
insightful.about.mission=Missiomme
insightful.about.missionDesc=Missiomme on rakentaa avoin ja luotettava tietojen jakamisen ympäristö ja muuttaa käyttäjien tuottama laadukas sisältö jatkuvasti kasvavaksi julkiseksi tietopohjaksi oppimista ja viitetarkoituksia varten.
insightful.about.features=Ominaisuutemme
insightful.about.feature1=Käyttäjien resurssien lataus- ja tarkistusjärjestelmä
insightful.about.feature2=Alusta korkealaatuisen sisällön jakamiseen
insightful.about.feature3=Monimuotoisten oppimateriaalien tuki (dokumentit, koodi, media, muistiinpanot)
insightful.about.feature4=Rakenteellinen tiedon organisointi
insightful.about.feature5=AI-avusteinen haku, luku ja tiivistys
insightful.about.impact=Vaikutuksemme
insightful.about.impactDesc=Viisauden Luku mahdollistaa käyttäjien jakaa arvokkaita oppimateriaaleja muiden kanssa ja hyödyntää yhteisön korkealaatuisia resursseja. Sisällön tarkistuksen ja rakenteellisen organisoinnin avulla alusta auttaa oppijoita saamaan luotettavaa tietoa tehokkaammin ja edistää positiivista tietojen jakamisen ekosysteemiä.
insightful.about.future=Tulevaisuuden näkymät
insightful.about.futureDesc=Tulevaisuudessa Viisauden Luku jatkaa sisällön tarkistusjärjestelmän ja tiedon organisointikykyjen parantamista sekä ottaa käyttöön lisää AI-pohjaisia työkaluja auttaakseen käyttäjiä löytämään, ymmärtämään ja hyödyntämään jaettua tietoa tehokkaammin.

