# 關於
insightful.about.title=關於 智篇
insightful.about.header=智篇 —— 知識分享與學習平台
insightful.about.aboutUs=關於我們
insightful.about.description=智篇是一個現代化的知識分享與學習平台，使用者可以上傳各類學習資源，經審核後向所有人共享。平台致力於匯聚、整理與傳播高品質的知識內容，包括文件、程式碼、媒體與筆記，並以結構化的方式幫助使用者高效地學習與使用這些資源。
insightful.about.mission=我們的使命
insightful.about.missionDesc=我們的使命是建構一個開放且可信的知識分享環境，將使用者貢獻的優質內容沉澱為持續成長的公共知識庫，供所有人學習與參考。
insightful.about.features=我們的功能
insightful.about.feature1=使用者資源上傳與審核機制
insightful.about.feature2=高品質內容共享平台
insightful.about.feature3=多格式學習資源支援（文件、程式碼、媒體、筆記）
insightful.about.feature4=結構化知識整理與分類
insightful.about.feature5=AI 輔助搜尋、閱讀與總結
insightful.about.impact=我們的影響
insightful.about.impactDesc=智篇讓使用者能夠分享有價值的學習資料，並從社群中取得高品質資源。透過內容審核與結構化管理，平台幫助學習者更高效地取得可靠知識，並逐步形成良性的知識共享生態。
insightful.about.future=未來展望
insightful.about.futureDesc=未來，智篇將持續完善內容審核機制與知識管理能力，並引入更多 AI 工具，幫助使用者更高效地發現、理解與重複使用共享知識。

