# About
insightful.about.title=O Moudrá kapitola
insightful.about.header=Moudrá kapitola — Platforma pro sdílení znalostí a učení
insightful.about.aboutUs=O nás
insightful.about.description=Moudrá kapitola je moderní platforma pro sdílení znalostí a učení, která umožňuje uživatelům nahrávat vzdělávací zdroje a po kontrole je sdílet s ostatními. Platforma pomáhá jednotlivcům i komunitám sbírat, organizovat a prozkoumávat vysoce kvalitní znalosti, včetně dokumentů, kódů, médií a poznámek, strukturovaným a udržitelným způsobem.
insightful.about.mission=Naše mise
insightful.about.missionDesc=Naší misí je vybudovat otevřené a spolehlivé prostředí pro sdílení znalostí a přeměnit kvalitní obsah přispěný uživateli na neustále rostoucí veřejnou znalostní databázi pro učení a referenci.
insightful.about.features=Naše funkce
insightful.about.feature1=Systém nahrávání a kontroly uživatelských zdrojů
insightful.about.feature2=Platforma pro sdílení kvalitního obsahu
insightful.about.feature3=Podpora více formátů vzdělávacích zdrojů (dokumenty, kód, média, poznámky)
insightful.about.feature4=Strukturovaná organizace znalostí
insightful.about.feature5=AI asistované vyhledávání, čtení a shrnutí
insightful.about.impact=Náš dopad
insightful.about.impactDesc=Moudrá kapitola umožňuje uživatelům sdílet cenné vzdělávací materiály s ostatními a těžit z kvalitních komunitních zdrojů. Díky kontrole obsahu a strukturované organizaci platforma pomáhá studentům efektivněji získávat spolehlivé znalosti a podporuje pozitivní ekosystém sdílení znalostí.
insightful.about.future=Výhled do budoucna
insightful.about.futureDesc=V budoucnu bude Moudrá kapitola nadále zlepšovat systém kontroly obsahu a schopnosti organizace znalostí a zavádět více AI nástrojů, které pomohou uživatelům efektivněji objevovat, chápat a znovu využívat sdílené znalosti.

