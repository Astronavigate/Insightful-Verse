# About
insightful.about.title=Om Visdoms Kapitel
insightful.about.header=Visdoms Kapitel — Platform for vidensdeling og læring
insightful.about.aboutUs=Om os
insightful.about.description=Visdoms Kapitel er en moderne platform for vidensdeling og læring, hvor brugere kan uploade læringsressourcer og dele dem med andre efter gennemgang. Platformen hjælper enkeltpersoner og fællesskaber med at samle, organisere og udforske højkvalitets vidensindhold, herunder dokumenter, kode, medier og noter, på en struktureret og bæredygtig måde.
insightful.about.mission=Vores mission
insightful.about.missionDesc=Vores mission er at skabe et åbent og pålideligt miljø for vidensdeling og omsætte brugergenereret kvalitetsindhold til en kontinuerligt voksende offentlig vidensbase til læring og reference.
insightful.about.features=Vores funktioner
insightful.about.feature1=Brugerressource-upload og gennemgangssystem
insightful.about.feature2=Platform for deling af kvalitetsindhold
insightful.about.feature3=Understøttelse af læringsressourcer i flere formater (dokumenter, kode, medier, noter)
insightful.about.feature4=Struktureret vidensorganisation
insightful.about.feature5=AI-assisteret søgning, læsning og opsummering
insightful.about.impact=Vores indflydelse
insightful.about.impactDesc=Visdoms Kapitel gør det muligt for brugere at dele værdifulde læringsmaterialer med andre og drage fordel af højkvalitets ressourcer fra fællesskabet. Gennem indholdsrevision og struktureret organisering hjælper platformen lærende med at få adgang til pålidelig viden mere effektivt og fremmer et positivt vidensdelingsøkosystem.
insightful.about.future=Fremtidige udsigter
insightful.about.futureDesc=I fremtiden vil Visdoms Kapitel fortsat forbedre sit indholdsgennemgangssystem og kapabiliteter for vidensorganisation samt introducere flere AI-drevne værktøjer, der hjælper brugere med at opdage, forstå og genbruge delt viden mere effektivt.

