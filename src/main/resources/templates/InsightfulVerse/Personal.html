<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Insightful Verse Personal</title>
  <th:block th:replace="~{common/sub/iviep/iviep-common.html}"></th:block>
</head>
<body class="default">
<th:block th:replace="~{common/sub/iviep/iviep-header :: header}"></th:block>

<div class="contain">
    <table class="table table-striped table-hover liquid" id="userInfoPlace">
        <tr>
            <td th:text="#{insightful.user.systemVersion}">System Version</td>
            <td><a href="/InsightfulVerse/Version" style="text-decoration-line: none" th:text="${ivVersion.version}"></a></td>
        </tr>
        <tr>
            <td th:text="#{insightful.user.info}">User Info</td>
            <td>
                <a type="button" class="btn btn-warning" th:href="@{/InsightfulVerse/UpdateUser}" th:text="#{insightful.user.change}">Change</a>
            </td>
        </tr>
        <tr>
            <td th:text="#{insightful.user.name}">Username</td>
            <td id="userNamePlace" th:text="${session.user.username}"></td>
        </tr>
        <tr>
            <td th:text="#{insightful.user.actions}">Actions</td>
            <td>
                <div class="btn-group" role="group" aria-label="Basic mixed styles">
                    <a type="button" class="btn btn-primary" th:href="@{/InsightfulVerse/Logout}" th:text="#{insightful.user.logout}">Log out</a>
                    <a type="button" class="btn btn-danger" th:href="@{/InsightfulVerse/Unregister}" th:text="#{insightful.user.unregister}">Unregister</a>
                    <a th:if="${session.user.authority == 'infinite'}" type="button" class="btn btn-info" th:href="@{/InsightfulVerse/NihilityZone}" th:text="#{insightful.user.noneZone}">NoneZone</a>
                </div>
            </td>
        </tr>
        <tr>
            <td th:text="#{insightful.user.accountId}">Account ID</td>
            <td id="userIdPlace" th:text="${session.user.userId}"></td>
        </tr>
        <tr>
            <td th:text="#{insightful.user.authority}">Authority</td>
            <td th:text="${session.user.authority}"></td>
        </tr>
        <tr>
            <td th:text="#{insightful.user.email}">Email</td>
            <td th:text="${session.user.email}"></td>
        </tr>
        <tr>
            <td th:text="#{insightful.user.phone}">Phone</td>
            <td th:text="${session.user.phone}"></td>
        </tr>
    </table>
</div>

<div class="contain">
    <table class="table table-striped table-hover liquid" id="viewListPlace">
        <tr>
            <td th:text="#{insightful.view.file}">File</td>
            <td th:text="#{insightful.view.count}">View Count</td>
            <td th:text="#{insightful.view.first}">First View Time</td>
            <td th:text="#{insightful.view.last}">Last Viewing Time</td>
        </tr>

        <tr th:if="${viewRecordList.isEmpty()}">
            <td th:text="#{insightful.view.none}">None</td>
            <td th:text="#{insightful.view.none}">None</td>
            <td th:text="#{insightful.view.none}">None</td>
            <td th:text="#{insightful.view.none}">None</td>
        </tr>

        <tr th:each="record : ${viewRecordList}">
            <td>
                <a th:href="@{/InsightfulVerse/File(fileId=${record.fileId})}" style="text-decoration: none; color: black;"
                   th:text="${record.file.fileName}" th:title="${record.file.remarks}"></a>
            </td>
            <td th:text="${record.viewCount}"></td>
            <td th:text="${#dates.format(record.firstView, 'yyyy-MM-dd HH:mm:ss')}"></td>
            <td th:text="${#dates.format(record.viewDate, 'yyyy-MM-dd HH:mm:ss')}"></td>
        </tr>

        <tr th:if="${!viewRecordList.isEmpty()}">
            <td colspan="3"></td>
            <td>
                <a th:href="@{/InsightfulVerse/ViewHistory}" style="text-decoration: none; color: black;" th:text="#{insightful.view.allHistory}">view all history</a>
            </td>
        </tr>
    </table>
</div>

<div class="blank"></div>

<th:block th:replace="~{common/sub/iviep/iviep-footer :: footer}"></th:block>

</body>
</html>
