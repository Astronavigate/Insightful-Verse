# 소개
insightful.about.title=Insightful Verse 소개
insightful.about.header=Insightful Verse 지능형 교육 플랫폼
insightful.about.aboutUs=회사 소개
insightful.about.description=Insightful Verse 지능형 교육 플랫폼(Insightful Verse 또는 IVIEP)은 학습과 지식 전달 방식을 혁신하는 최첨단 교육 기술 플랫폼입니다. 모든 연령과 배경의 학습자에게 개인화되고 몰입감 있는 학습 경험을 제공하기 위해 설립되었으며, 학습자가 학업 및 경력 목표를 달성할 수 있도록 돕는 도구와 자원을 제공합니다.
insightful.about.mission=우리의 사명
insightful.about.missionDesc=우리는 학생들이 열정을 탐구하고, 비판적 사고력을 개발하며, 평생 학습의 견고한 기반을 구축할 수 있는 포용적이고 협력적인 학습 환경을 조성하는 것을 목표로 합니다.
insightful.about.features=주요 기능
insightful.about.feature1=개인화된 학습 경로
insightful.about.feature2=인터랙티브 콘텐츠
insightful.about.feature3=협업 학습
insightful.about.feature4=실시간 피드백
insightful.about.feature5=통합 도구
insightful.about.impact=성과
insightful.about.impactDesc=수천 명의 학생들이 개인화된 학습 경로와 상호작용 콘텐츠를 통해 학업 성취도와 참여도를 향상시켰습니다. 교사와 멘토들 또한 플랫폼 사용으로 효율성과 만족도가 높아졌다고 보고했습니다.
insightful.about.future=미래 전망
insightful.about.futureDesc=우리는 계속해서 학습자의 변화하는 요구에 맞춰 기능과 서비스를 확장할 계획입니다. 또한 인공지능과 기계 학습과 같은 첨단 기술을 도입하여 학습 경험을 더욱 개인화하고, 성공을 위한 더 효과적인 도구를 제공할 것입니다.

