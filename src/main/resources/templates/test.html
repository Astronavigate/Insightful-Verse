<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>DOCX 文档预览 - 秩序化渲染</title>

    <script src="https://unpkg.com/jszip/dist/jszip.min.js"></script>
    <script src="https://unpkg.com/docx-preview/dist/docx-preview.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/docx-preview/dist/docx-preview.css" />

    <style>
        /* 极简与冷峻风格样式：突出内容，保持克制 */
        body {
            background-color: #1a1a1a; /* 深色背景，夜色意象 */
            color: #e0e0e0;
            margin: 0;
            padding: 40px 0;
            font-family: Consolas, 'Microsoft YaHei', sans-serif;
        }
        #document-container {
            width: 800px; /* 设定固定宽度，体现秩序与架构 */
            min-height: 900px;
            margin: 0 auto;
            padding: 40px;
            background-color: #ffffff; /* 文档内容区域保持冰白背景 */
            color: #000000;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5); /* 沉稳的阴影 */
            border: 1px solid #333333; /* 钢的边缘 */
            /* docx-preview 库会在这里渲染内容 */
        }
        .loading {
            text-align: center;
            color: #007acc; /* 深蓝提示色 */
            padding: 50px;
        }
    </style>
</head>
<body>

<div id="document-container" class="loading">
    <p>独行至远，洞察超越。正在获取文档...</p>
</div>

<script>
    // 目标文档路径
    const DOCX_URL = "/doc/test.docx";
    // 渲染容器
    const container = document.getElementById("document-container");

    /**
     * [意志与理智] 核心文档加载与渲染模块
     */
    async function loadAndRenderDocx() {
        try {
            // 1. 发起网络请求，获取文档二进制数据
            // responseType 必须设置为 'arraybuffer' 以获取文件字节流，这是 docx-preview 所需的输入格式。
            const response = await fetch(DOCX_URL);

            if (!response.ok) {
                // 严格的逻辑检查，拒绝模糊状态
                throw new Error(`无法获取文件。HTTP 状态码: ${response.status}`);
            }

            // 2. 将响应体转换为 ArrayBuffer
            const docxArrayBuffer = await response.arrayBuffer();

            // 3. 定义渲染选项 (Options) - 保持极简默认
            const renderOptions = {
                className: "docx",     // 默认样式类名
                inWrapper: true,       // 启用包装器，保持页面结构秩序
                ignoreWidth: false,    // 保留文档宽度信息
            };

            // 清除加载提示
            container.classList.remove('loading');
            container.innerHTML = '文档解析中...';

            // 4. 调用 docx.renderAsync 异步渲染
            // 将 ArrayBuffer 和容器传入，实现纯前端解析
            await docx.renderAsync(docxArrayBuffer, container, null, renderOptions);

            console.log(`[秩序] 文档：${DOCX_URL} 渲染成功，功能已实现。`);

        } catch (error) {
            console.error("[错误] 文档渲染失败:", error);
            // 失败处理：克制且清晰地显示错误
            container.classList.remove('loading');
            container.innerHTML = `
                <div style="color: #d9534f; text-align: center; padding: 50px;">
                    [错误] 渲染失败。请确认路径和服务器配置正确。<br>
                    原因: ${error.message}
                </div>
            `;
        }
    }

    // 启动流程
    loadAndRenderDocx();
</script>

</body>
</html>
