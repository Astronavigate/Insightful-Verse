# ==================== About ====================
insightful.about.title=Tentang Insightful Verse
insightful.about.header=Platform Pendidikan Cerdas Insightful Verse
insightful.about.aboutUs=Tentang Kami
insightful.about.description=Insightful Verse Intelligence Educating Platform (Insightful Verse atau IVIEP) adalah platform teknologi pendidikan canggih yang merevolusi cara pembelajaran dilakukan dan pengetahuan disampaikan. Didirikan dengan visi menyediakan pengalaman belajar yang personal dan menarik bagi siswa dari segala usia dan latar belakang, Insightful Verse bertujuan memberdayakan pembelajar dengan alat dan sumber daya yang dibutuhkan untuk mencapai tujuan akademik dan karier mereka.
insightful.about.mission=Misi Kami
insightful.about.missionDesc=Misi kami adalah menciptakan lingkungan belajar yang inklusif dan kolaboratif di mana siswa dapat mengeksplorasi minat mereka, mengembangkan kemampuan berpikir kritis, dan membangun dasar yang kuat untuk pembelajaran seumur hidup.
insightful.about.features=Fitur Kami
insightful.about.feature1=Jalur Pembelajaran Personal
insightful.about.feature2=Konten Interaktif
insightful.about.feature3=Belajar Kolaboratif
insightful.about.feature4=Umpan Balik Real-time
insightful.about.feature5=Alat Terintegrasi
insightful.about.impact=Dampak Kami
insightful.about.impactDesc=Ribuan siswa telah memperoleh manfaat dari jalur pembelajaran personal dan konten interaktif kami, meningkatkan kinerja akademik dan keterlibatan. Guru dan mentor juga melaporkan peningkatan efisiensi dan kepuasan dengan platform kami.
insightful.about.future=Pandangan Masa Depan
insightful.about.futureDesc=Ke depannya, kami berencana untuk terus memperluas fitur dan layanan untuk memenuhi kebutuhan pembelajar yang terus berkembang. Kami berupaya mengintegrasikan teknologi canggih seperti kecerdasan buatan dan pembelajaran mesin untuk mempersonalisasi pengalaman belajar lebih lanjut dan memberikan alat yang lebih efektif bagi siswa.


