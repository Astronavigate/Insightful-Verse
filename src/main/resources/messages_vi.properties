# ==================== 关于（About） ====================
insightful.about.title=Giới thiệu về Insightful Verse
insightful.about.header=Nền tảng giáo dục thông minh Insightful Verse
insightful.about.aboutUs=Về chúng tôi
insightful.about.description=Nền tảng giáo dục thông minh Insightful Verse (Insightful Verse hoặc IVIEP) là một nền tảng công nghệ giáo dục tiên tiến, cách mạng hóa phương pháp học tập và truyền đạt kiến thức. Được thành lập với tầm nhìn cung cấp trải nghiệm học tập cá nhân hóa và hấp dẫn cho học sinh mọi lứa tuổi và xuất thân, Insightful Verse hướng đến việc trang bị cho học viên những công cụ và tài nguyên cần thiết để đạt được mục tiêu học tập và nghề nghiệp.
insightful.about.mission=Sứ mệnh của chúng tôi
insightful.about.missionDesc=Sứ mệnh của chúng tôi là tạo ra một môi trường học tập toàn diện và hợp tác, nơi học sinh có thể khám phá đam mê, phát triển tư duy phản biện và xây dựng nền tảng vững chắc cho việc học tập suốt đời.
insightful.about.features=Tính năng của chúng tôi
insightful.about.feature1=Lộ trình học tập cá nhân hóa
insightful.about.feature2=Nội dung tương tác
insightful.about.feature3=Học tập hợp tác
insightful.about.feature4=Phản hồi theo thời gian thực
insightful.about.feature5=Công cụ tích hợp
insightful.about.impact=Tác động của chúng tôi
insightful.about.impactDesc=Hàng ngàn học sinh đã được hưởng lợi từ lộ trình học tập cá nhân hóa và nội dung tương tác, dẫn đến cải thiện thành tích học tập và mức độ tham gia cao hơn. Giáo viên và cố vấn cũng báo cáo tăng hiệu quả và sự hài lòng khi sử dụng nền tảng.
insightful.about.future=Tầm nhìn tương lai
insightful.about.futureDesc=Nhìn về phía trước, chúng tôi dự định tiếp tục mở rộng các tính năng và dịch vụ để đáp ứng nhu cầu ngày càng tăng của học viên. Chúng tôi hướng đến việc tích hợp các công nghệ tiên tiến hơn, chẳng hạn như trí tuệ nhân tạo và học máy, để cá nhân hóa trải nghiệm học tập hơn nữa và cung cấp cho học sinh các công cụ hiệu quả hơn để thành công.

