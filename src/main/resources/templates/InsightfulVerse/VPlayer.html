<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title th:text="'Insightful Verse Player ' + ${file != null ? ' - ' + file.fileName : ''}">Insightful Verse Player</title>

    <style>
        /* --- 结构与基础样式 --- */
        :root { --header-h: 72px; --sub-min: 1rem; --sub-max: 1.8rem; }
        html { font-size: 16px; } /* 1rem = 16px base */
        body { margin:0; background:#0a0a0a !important; color:#ddd; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }

        /* layout */
        .video-wrap { box-sizing:border-box; padding:0; /* 移除 padding 保持全屏利用率 */ height: calc(100vh - var(--header-h)); display:flex; align-items:center; justify-content:center; }
        .player-box {
            position:relative;
            width:100%;
            max-width:1200px;
            height:100%;
            display:flex;
            align-items:center;
            justify-content:center;
            /* 🎯 视频圆角优化：圆角应用于容器，而非视频元素本身 */
            border-radius:12px;
            overflow:hidden;
        }

        /* video */
        video {
            width:100%;
            height:100%;
            object-fit:contain;
            background:#000;
            /* 移除 video 上的圆角 */
            border-radius:0;
            box-shadow:0 8px 30px rgba(0,0,0,0.6);
            outline:none;
            display:block;
        }

        /* --- 字幕显示重构：移除模糊背景，重做文字样式 --- */
        .sub-overlay { pointer-events: none; position:absolute; inset:0; z-index:50; display:flex; align-items:flex-end; justify-content:center; padding:0 6%; box-sizing:border-box; }
        .sub-line-wrap {
            pointer-events:none;
            margin-bottom: clamp(4vh, 6vh, 8vh); /* adapt vertical offset */
            background: rgba(0,0,0,0.7); /* 🎯 纯黑色背景，无模糊 */
            padding: 8px 14px;
            border-radius: 10px;
            /* 🎯 移除 backdrop-filter: blur(4px); */
            max-width: 88%;
            text-align: center;
            box-sizing: border-box;
        }

        /* CLASSIC: white text with black outline */
        .sub-line {
            display: block;
            margin: 0;
            line-height: 1.2;
            /* 🎯 响应式字号：使用 rem/vw/clamp */
            font-size: clamp(1.1rem, calc(1rem + 1vw), 2.0rem);
            color: #ffffff; /* 🎯 确保白色 */

            /* 🎯 黑色边框/阴影 */
            -webkit-text-stroke: 0.04em rgba(0,0,0,0.9); /* em based stroke for font scaling */
            text-stroke: 0.04em rgba(0,0,0,0.9);
            text-shadow:
                    0.04em 0 rgba(0,0,0,0.8),
                    -0.04em 0 rgba(0,0,0,0.8),
                    0 0.04em rgba(0,0,0,0.8),
                    0 -0.04em rgba(0,0,0,0.8),
                    0.04em 0.04em rgba(0,0,0,0.8),
                    -0.04em -0.04em rgba(0,0,0,0.8);
            font-weight: 700;
            word-wrap: break-word;
            white-space: pre-wrap;
            hyphens: auto;
        }

        /* --- 切换按钮优化：右下角，悬浮显示 --- */
        #subtitle-toggle-icon {
            /* 🎯 移至右下角 */
            position:absolute; right:10px; bottom:10px;
            z-index:120; width:36px; height:36px; border-radius:8px;
            display:flex; align-items:center; justify-content:center;
            cursor:pointer; opacity:0;
            transition: opacity .16s ease, transform .12s ease;
            pointer-events:auto;
            background: rgba(0,0,0,0.5); /* 统一背景色 */
        }
        .player-box:hover #subtitle-toggle-icon, .player-box:focus-within #subtitle-toggle-icon { opacity:0.96; transform: translateY(0); }
        @media (hover: none) { #subtitle-toggle-icon { opacity: 0.6; } }
        #subtitle-toggle-icon svg { filter: none; } /* 移除冗余的 drop-shadow */
        #subtitle-toggle-icon svg path { stroke: #fff; }

        /* small hint (brief) */
        .sub-hint {
            position:absolute; right:12px; bottom:12px;
            z-index:130; /* 比 toggle icon 高 */
            font-size:0.8rem; /* 🎯 rem 单位 */
            color:#fff;
            background: rgba(0,0,0,0.6);
            padding:6px 10px;
            border-radius:6px;
            display:none;
            pointer-events:none;
            opacity:0;
            transition: opacity .3s ease;
        }

        @media (max-width:640px) {
            .sub-line { font-size: clamp(1rem, calc(0.9rem + 1.5vw), 1.5rem); }
            .sub-line-wrap { margin-bottom: 8vh; padding: 6px 10px; }
        }
    </style>
    <th:block th:replace="~{common/sub/iviep/iviep-common.html}"></th:block>
</head>
<body>
<th:block th:replace="~{common/sub/iviep/iviep-header :: header}"></th:block>

<div class="video-wrap">
    <div class="player-box">
        <video id="player" controls crossorigin="anonymous" th:if="${file != null}">
            <source th:src="${file.filePath}" th:type="'video/' + ${file.type}" />
            <p>Your browser does not support video playback.</p>
        </video>

        <div id="subOverlay" class="sub-overlay" aria-live="polite" role="region">
            <div class="sub-line-wrap">
                <div id="subCur" class="sub-line" aria-hidden="false"></div>
            </div>
        </div>

        <div id="subtitle-toggle-icon" title="切换字幕显示（T 切换）">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="2" y="4" width="20" height="16" rx="2" ry="2" fill="none"></rect>
                <path d="M6 8h12M6 12h8" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M12 16h6" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
        </div>

        <div id="subHint" class="sub-hint"></div>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const FILE_PATH = /*[[${file != null ? file.filePath : null}]]*/ null;
    const FILE_TYPE = /*[[${file != null ? file.type : null}]]*/ null;
    /*]]>*/
</script>

<script>
    (function(){
        const log = (...a)=>console.log('[SUBT-INVIDEO]',...a);
        if(!FILE_PATH){ log('FILE_PATH missing; subtitles disabled.'); return; }

        const playerBox = document.querySelector('.player-box');
        const video = document.getElementById('player');
        const overlay = document.getElementById('subOverlay');
        const curEl = document.getElementById('subCur');
        const hint = document.getElementById('subHint');
        const toggleIcon = document.getElementById('subtitle-toggle-icon');

        // wire toggle icon
        if(toggleIcon){
            toggleIcon.addEventListener('click', (e)=>{ e.stopPropagation(); e.preventDefault(); if(window._subtitle_fix && typeof window._subtitle_fix.toggle === 'function'){ window._subtitle_fix.toggle(); } else { const ev = new KeyboardEvent('keydown', { key: 'T' }); window.dispatchEvent(ev); } });
            // mobile longpress
            let tm=null;
            toggleIcon.addEventListener('touchstart', ()=>{ tm = setTimeout(()=>toggleIcon.click(), 600); }, { passive:true });
            toggleIcon.addEventListener('touchend', ()=>{ if(tm) clearTimeout(tm); }, { passive:true });
        }

        // resolve absolute file URL and base
        let fileUrl;
        try { fileUrl = (typeof FILE_PATH === 'string' && (FILE_PATH.startsWith('http://') || FILE_PATH.startsWith('https://'))) ? FILE_PATH : new URL(FILE_PATH, location.origin).href; } catch(e) { fileUrl = location.origin + FILE_PATH; }
        const clean = fileUrl.split('#')[0].split('?')[0];
        const base = clean.replace(/\.[^/.]+$/, '');

        log('fileUrl:', fileUrl, 'base:', base);

        // loader/parsers (same as previous implementation)
        const candidates = [{ext:'.vtt',type:'vtt'},{ext:'.srt',type:'srt'},{ext:'.lrc',type:'lrc'}];
        let cues = [], usingNative = true, TOL = 0.200;

        async function fetchIfExists(url){
            try{ const r = await fetch(url, { credentials:'same-origin' }); if(!r.ok) return { ok:false, status:r.status }; return { ok:true, text: await r.text(), contentType: r.headers.get('content-type') }; } catch(e){ return { ok:false, error:e }; }
        }

        function parseSrtToCues(srtText){
            const blocks = srtText.replace(/\r+/g,'').split('\n\n').filter(Boolean);
            const out = [];
            for(const b of blocks){
                const lines = b.split('\n').filter(Boolean);
                if(lines.length<2) continue;
                let idx=0; if(/^\d+$/.test(lines[0].trim())) idx=1;
                const timeLine = lines[idx] || '';
                const m = timeLine.match(/(\d{2}:\d{2}:\d{2}[.,]\d{1,3})\s*-->\s*(\d{2}:\d{2}:\d{2}[.,]\d{1,3})/);
                if(!m) continue;
                function toSec(ts){ const parts = ts.replace(',', '.').split(':'); const h=parseInt(parts[0],10), mm=parseInt(parts[1],10); const sp = parts[2].split('.'); const s=parseInt(sp[0],10); const ms = sp[1]? parseInt((sp[1]+'000').slice(0,3),10):0; return h*3600 + mm*60 + s + ms/1000; }
                out.push({ start: toSec(m[1]), end: toSec(m[2]), text: lines.slice(idx+1).join('\n').trim() });
            }
            out.sort((a,b)=>a.start-b.start); return out;
        }

        function parseLrcToCues(lrcText){
            const lines = lrcText.replace(/\r+/g,'').split('\n'); const raw=[];
            for(const ln of lines){
                if(!ln) continue;
                const parts = ln.split(/(?=\[\d{1,2}:\d{2}(?:\.\d{1,3})?\])/);
                for(const p of parts){
                    const m = p.match(/^\[(\d{1,2}):(\d{2})(?:\.(\d{1,3}))?\](.*)/);
                    if(!m) continue;
                    const mm = parseInt(m[1],10), ss=parseInt(m[2],10), ms = m[3]? parseInt((m[3]+'000').slice(0,3),10):0;
                    const start = mm*60 + ss + ms/1000; const text = (m[4]||'').trim();
                    if(text) raw.push({ start, text });
                }
            }
            raw.sort((a,b)=>a.start-b.start);
            return raw.map((r,i)=>({ start: r.start, end: (i+1<raw.length?raw[i+1].start: r.start+3.0), text: r.text }));
        }

        function srtToVttText(srtText){
            const blocks = srtText.replace(/\r+/g,'').split('\n\n').filter(Boolean); let vtt='WEBVTT\n\n';
            for(const b of blocks){
                const lines = b.split('\n').filter(Boolean);
                if(lines.length===0) continue;
                // 移除 SRT 序号行
                if(/^\d+$/.test(lines[0].trim())) lines.shift();
                if(lines.length===0) continue;
                // 时间戳转换：将 , 替换为 . 并确保 3 位毫秒
                const timeLine = lines.shift();
                const tf = timeLine.replace(/,(\d{1,3})/g,(m,p)=>'.'+p.padEnd(3,'0'));
                vtt += tf + '\n' + lines.join('\n') + '\n\n';
            }
            return vtt;
        }

        function injectVttAsTrack(vttText,label){
            try{
                const blob = new Blob([vttText], { type:'text/vtt' });
                const url = URL.createObjectURL(blob);
                const tr = document.createElement('track');
                tr.kind='subtitles'; tr.label=label||'sub'; tr.srclang='zh'; tr.src = url;
                tr.crossOrigin = 'anonymous'; // 确保跨域加载时的安全性
                video.appendChild(tr);
                // 监听加载事件，尝试设置 mode 为 showing
                tr.addEventListener('load', ()=>{ try{ if(!usingNative) tr.mode='hidden'; else tr.mode='showing'; log('Track loaded:', label); }catch(e){log('load err', e)} });
                log('Injected track', label);
                return true;
            } catch(e){ log('inject failed', e); return false; }
        }

        function setAllTracksMode(mode){ try{ const tt = video.textTracks||[]; for(let i=0;i<tt.length;i++){ try{ tt[i].mode = mode; }catch(e){} } } catch(e){} }

        (async function loadSubtitles(){
            log('Loading subtitles for in-video overlay...');
            let subtitleLoaded = false;
            for(const c of candidates){
                const url = base + c.ext;
                log('try', url);
                const res = await fetchIfExists(url);
                log('->', res && (res.ok ? ('200; ct=' + res.contentType) : ('status=' + (res.status || res.error))));
                if(!res || !res.ok) continue;

                if(c.type==='vtt'){
                    injectVttAsTrack(res.text,'VTT');
                    try{
                        // 轻量级 VTT 解析，用于自定义渲染回退
                        const parts=res.text.split(/\n\n+/).filter(Boolean);
                        cues = parts.map(p=>{
                            const lines=p.split('\n').filter(Boolean);
                            const tline = lines.find(l=>l.includes('-->'))||'';
                            const m=tline.match(/(\d{2}:\d{2}:\d{2}\.\d{3})\s*-->\s*(\d{2}:\d{2}:\d{2}\.\d{3})/);
                            if(!m) return null;
                            function toSec(ts){ const ps=ts.split(':'); const h=parseInt(ps[0],10),mi=parseInt(ps[1],10); const sp=ps[2].split('.'); const s=parseInt(sp[0],10); const ms=parseInt(sp[1],10); return h*3600+mi*60+s+ms/1000; }
                            const start=toSec(m[1]), end=toSec(m[2]);
                            const txt = lines.filter(l=>!l.includes('-->') && !/^\d+$/.test(l)).join('\n').trim();
                            return { start,end,text:txt };
                        }).filter(Boolean);
                    }catch(e){log('VTT parse error', e)}
                    subtitleLoaded = true;
                    break;
                }

                if(c.type==='srt'){
                    cues = parseSrtToCues(res.text);
                    const vtt = srtToVttText(res.text);
                    injectVttAsTrack(vtt,'SRT->VTT');
                    subtitleLoaded = true;
                    break;
                }

                if(c.type==='lrc'){
                    cues = parseLrcToCues(res.text);
                    // 仅为 LRC 生成 VTT 注入，但其精度可能不如 SRT
                    let vtt='WEBVTT\n\n';
                    for(const cu of cues){
                        // 将 LRC 的 cue 转换为 VTT 块，结束时间设置为下一个 cue 的开始时间
                        const s=new Date(cu.start*1000).toISOString().substr(11,12);
                        const e=new Date(cu.end*1000).toISOString().substr(11,12);
                        vtt += `${s} --> ${e}\n${cu.text}\n\n`;
                    }
                    injectVttAsTrack(vtt,'LRC->VTT');
                    subtitleLoaded = true;
                    break;
                }
            }
            log('cues.length =', cues.length);

            // 延迟检查，确保所有 track 都已加载
            setTimeout(()=>{
                try{
                    const tt = video.textTracks||[];
                    const info=[];
                    let anyShowing=false;
                    for(let i=0;i<tt.length;i++){
                        try{
                            info.push({label:tt[i].label,kind:tt[i].kind,mode:tt[i].mode});
                            if(tt[i].mode==='showing') anyShowing=true;
                        }catch(e){}
                    }
                    log('textTracks', info);

                    // 默认启用原生字幕，除非没有加载成功或没有显示
                    if(!anyShowing && cues.length > 0){
                        log('No native showing -> falling back to custom overlay');
                        enableCustomRendering(true); // 首次加载，强制显示
                    } else {
                        log('Native active:', anyShowing);
                        usingNative=true;
                        overlay.style.display='none';
                        video.removeEventListener('timeupdate', onCustomTick);
                        video.addEventListener('timeupdate', onNativeTick);
                    }
                }catch(e){
                    log('check tracks err', e);
                    if(cues.length>0) enableCustomRendering(true);
                }
            }, 600); // 增加延迟，确保 track fully loaded
        })();

        function enableCustomRendering(initial=false){
            usingNative=false;
            overlay.style.display='flex';
            setAllTracksMode('hidden'); // 隐藏所有原生 track
            video.removeEventListener('timeupdate', onNativeTick);
            video.addEventListener('timeupdate', onCustomTick);
            renderOverlay();
            if(!initial) showHint('Custom overlay subtitles'); // 只有切换时才显示 hint
        }

        function onNativeTick() {} // 原生模式下不需要自定义渲染

        function onCustomTick(){ renderOverlay(); }

        function renderOverlay(){
            if(!cues || cues.length===0){ overlay.style.display='none'; return; }
            const now = video.currentTime, t = now + TOL;
            let lo=0, hi=cues.length-1, idx=-1;
            // 使用二分查找寻找当前时间点最接近的 cue
            while(lo<=hi){ const mid=Math.floor((lo+hi)/2); if(cues[mid].start <= t){ idx=mid; lo=mid+1; } else hi=mid-1; }
            if(idx===-1){ overlay.style.display='none'; return; }
            const cue = cues[idx];

            // 检查当前时间是否在 cue 的 start 和 end 之间 (考虑 TOL 容错)
            if(!(now + TOL >= cue.start && now - TOL < cue.end)){ overlay.style.display='none'; return; }

            curEl.textContent = cue.text;
            overlay.style.display = 'flex';
        }

        // 🎯 优化 Hint 显示逻辑
        function showHint(text){
            try{
                hint.textContent=text;
                hint.style.display='block';
                hint.style.transition='none'; // 立即显示
                hint.style.opacity='1';
                // 清除之前的定时器
                if(hint._t) clearTimeout(hint._t);
                // 设置新的定时器，保持显示 1.6 秒后淡出
                hint._t = setTimeout(()=>{
                    hint.style.transition='opacity .4s';
                    hint.style.opacity='0';
                    setTimeout(()=>hint.style.display='none', 400);
                }, 1600);
            }catch(e){}
        }

        // keyboard T/D
        window.addEventListener('keydown',(e)=>{
            if(e.key==='t'||e.key==='T'){
                if(usingNative){
                    enableCustomRendering();
                    showHint('Subtitles: Custom Overlay');
                } else {
                    usingNative=true;
                    overlay.style.display='none';
                    setAllTracksMode('showing');
                    video.removeEventListener('timeupdate', onCustomTick);
                    video.addEventListener('timeupdate', onNativeTick);
                    showHint('Subtitles: Native Browser');
                }
            }
            if(e.key==='d'||e.key==='D'){ printDebug(); }
        });

        // 保持调试功能不变
        function printDebug(){ try{ const tt = video.textTracks||[]; const info=[]; for(let i=0;i<tt.length;i++){ try{ info.push({idx:i,label:tt[i].label,kind:tt[i].kind,mode:tt[i].mode}); }catch(e){} } log('DEBUG => fileUrl:', fileUrl, 'base:', base, 'cues:', cues.length, 'textTracks:', info, 'usingNative:', usingNative); alert('调试信息已输出到 Console'); }catch(e){ log('printDebug err', e); } }

        window._subtitle_fix = { fileUrl, base, cues, toggle: ()=>{ if(usingNative){ enableCustomRendering(); showHint('Subtitles: Custom Overlay');} else { usingNative=true; overlay.style.display='none'; setAllTracksMode('showing'); video.removeEventListener('timeupdate', onCustomTick); video.addEventListener('timeupdate', onNativeTick); showHint('Subtitles: Native Browser');} }, print: printDebug, stop: ()=>{ try{ setAllTracksMode('hidden'); overlay.style.display='none'; video.removeEventListener('timeupdate', onCustomTick); log('stopped'); }catch(e){} } };

        log('In-video subtitle ready. T toggle · D debug.');
    })();
</script>
</body>
</html>
